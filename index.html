<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root{--accent:#6366f1;--bg:#0e1015;--card:#171a22;--text:#e9ecf3;--muted:#8a92a6;--line:#242835;--fs:1;--online:#10b981}
body.light{--bg:#f4f5f9;--card:#fff;--text:#14161c;--muted:#6b7280;--line:#e6e8ef}
html,body{height:100%}
body{background:var(--bg);color:var(--text);overflow:hidden;font-size:calc(14px*var(--fs))}
#app{height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:12px}.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.btn{background:var(--card);border:1px solid var(--line);padding:12px 16px;border-radius:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.success{background:#10b981;border-color:#10b981;color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{background:#ef4444;border-color:#ef4444;color:#fff}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.icon{padding:8px;border-radius:10px;font-size:18px}
.auth-wrap{flex:1;display:grid;place-items:center;padding:20px;overflow-y:auto}

.logo{font-size:26px;font-weight:800;color:var(--accent)}
.err{color:#ef4444;font-size:13px;min-height:18px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}

.ava.sm{width:34px;height:34px;font-size:17px;border-radius:12px}
.ava.big{width:64px;height:64px;font-size:30px;border-radius:20px}
.ava.xs{width:26px;height:26px;font-size:14px;border-radius:9px}
.ava.huge{width:110px;height:110px;font-size:54px;border-radius:36px}
.ava-online::after{content:'';position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;background:var(--online);border:2px solid var(--card);border-radius:50%}
.content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.content.chat{padding:0;gap:0}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card)}
.tab{flex:1;padding:10px 4px;font-size:11px;color:var(--muted);position:relative}
.tab.on{color:var(--accent);font-weight:600}
.tab-badge{position:absolute;top:4px;right:calc(50% - 22px);background:#ef4444;color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;min-width:16px;text-align:center}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;position:relative}
.item.unread{background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.item-badge{background:#ef4444;color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:700;min-width:20px;text-align:center}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.banner{margin:10px;padding:12px;border:1px solid var(--accent);border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,var(--card));display:flex;flex-direction:column;gap:8px}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg-row{display:flex;gap:6px;align-items:flex-end;max-width:88%}
.msg-row.in{align-self:flex-start}
.msg-row.out{align-self:flex-end;flex-direction:row-reverse}
.msg-menu-btn{font-size:16px;color:var(--muted);opacity:0;padding:4px}
.msg-row:hover .msg-menu-btn{opacity:1}
.msg{display:flex;flex-direction:column;min-width:0;max-width:100%}
.msg.out{align-items:flex-end}.msg.in{align-items:flex-start}
.bubble{padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);word-break:break-word;max-width:100%}
.msg.out .bubble{background:var(--accent);border-color:var(--accent);color:#fff}
.bubble a{text-decoration:underline}
.bubble img.msg-image{max-width:260px;max-height:260px;border-radius:12px;display:block;margin-bottom:6px;object-fit:cover;cursor:pointer}
.bubble audio{max-width:260px;display:block;margin-bottom:4px}
.bubble video{max-width:280px;max-height:240px;border-radius:12px;display:block;margin-bottom:6px;background:#000}
.file-link{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:rgba(0,0,0,.25);text-decoration:none;color:inherit;margin-bottom:6px;max-width:280px}
.file-icon{font-size:22px;flex:none}
.file-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px}
.file-size{display:block;font-size:11px;opacity:.7}
.sender-name{font-size:11px;color:var(--accent);margin-bottom:2px;font-weight:600}
.edited-mark{opacity:.7;font-size:11px;margin-left:4px}
.ts{font-size:11px;color:var(--muted);margin-top:3px}
.reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.reaction-chip{padding:2px 8px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px;cursor:pointer}
.reaction-chip.mine{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 25%,transparent)}
.composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);align-items:center}

.story{min-width:104px;height:150px;border-radius:18px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;font-weight:600;font-size:13px;cursor:pointer;background-size:cover;background-position:center;position:relative;overflow:hidden}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;z-index:50}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal{width:100%;max-width:460px;max-height:85vh;overflow:auto;position:relative}
.call{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;min-width:280px;max-width:520px}
.call-controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.call-btn.off{background:#ef4444;border-color:#ef4444;color:#fff}
.call-btn.danger{background:#ef4444;border-color:#ef4444;color:#fff}

.ai-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}

.ai-composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:center}
.ai-composer .icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--bg);border:1px solid var(--line);flex:none}
.floating-ai{position:fixed;right:18px;bottom:78px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:24px;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:40}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

function setupWebRTC(){if(!state.call||pc||!state.stream)return;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});state.stream.getTracks().forEach(t=>pc.addTrack(t,state.stream));const d=dummyVT();const tr=d?pc.addTransceiver(d,{direction:'sendrecv'}):pc.addTransceiver('video',{direction:'sendrecv'});videoSender=tr.sender;pc.ontrack=e=>{if(e.track.kind==='audio'){let a=document.getElementById('remote-audio');if(!a){a=document.createElement('audio');a.id='remote-audio';a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0]||new MediaStream([e.track]);a.play().catch(()=>{})}else if(e.track.kind==='video'){remoteStream=e.streams[0]||new MediaStream([e.track]);attachRemote()}};pc.onicecandidate=e=>{if(e.candidate)sendSig('ice',{candidate:e.candidate.toJSON()})};pc.onconnectionstatechange=()=>{const el=document.getElementById('call-status'),dg=document.getElementById('call-diag');if(el)el.textContent=pc.connectionState==='connected'?t('connected'):pc.connectionState;if(dg)dg.textContent=`ICE:${pc.iceConnectionState}|Track:${videoSender?.track?.kind||'none'}`};subSigs(state.call.id);startSigPoll(state.call.id);if(state.call.outbound){pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>sendSig('offer',{sdp:pc.localDescription.toJSON()})).catch(e=>console.warn(e))}}
function subSigs(cid){if(sigChannel)sb.removeChannel(sigChannel);sigChannel=sb.channel('sig_'+cid).on('postgres_changes',{event:'INSERT',schema:'public',table:'call_signals',filter:`call_id=eq.${cid}`},p=>{if(p.new.sender_id===state.user.id)return;if(processed.has(p.new.id))return;processed.add(p.new.id);procSig(p.new)}).subscribe()}
function startSigPoll(cid){if(sigPollTimer)clearInterval(sigPollTimer);sigPollTimer=setInterval(async()=>{if(!state.call||state.call.id!==cid)return;try{const {data}=await sb.from('call_signals').select('*').eq('call_id',cid).order('created_at');for(const s of data||[]){if(processed.has(s.id))continue;if(s.sender_id===state.user.id)continue;processed.add(s.id);await procSig(s)}}catch(e){}},900)}
async function sendSig(type,payload){if(!state.call)return;await sb.from('call_signals').insert({call_id:state.call.id,sender_id:state.user.id,type,payload})}
async function procSig(s){if(!pc)return;try{if(s.type==='offer'){await pc.setRemoteDescription(new RTCSessionDescription(s.payload.sdp));const a=await pc.createAnswer();await pc.setLocalDescription(a);await sendSig('answer',{sdp:pc.localDescription.toJSON()})}else if(s.type==='answer'){await pc.setRemoteDescription(new RTCSessionDescription(s.payload.sdp))}else if(s.type==='ice'){await pc.addIceCandidate(new RTCIceCandidate(s.payload.candidate)).catch(()=>{})}}catch(e){console.warn(e)}}

function updVS(){const tr=screenTrack||cameraTrack||dummyVT();if(videoSender&&tr)videoSender.replaceTrack(tr).catch(e=>console.warn(e));attLocal()}

function tMute(){
  if(!state.stream)return;
  const tr=state.stream.getAudioTracks()[0];if(!tr)return;
  tr.enabled=!tr.enabled;state.muted=!tr.enabled;pMute(!state.muted);
  const b=document.querySelector('[data-act="t-mute"]');
  if(b){b.className='call-btn'+(state.muted?' off':'');b.textContent=state.muted?'🔇':'🎤'}
}
async function tCam(){
  if(state.cameraOn){cameraTrack?.stop();cameraTrack=null;state.cameraOn=false;updVS();pCam(false)}
  else{try{const st=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});cameraTrack=st.getVideoTracks()[0];state.cameraOn=true;updVS();pCam(true)}catch(e){toast('Камера: '+e.message);return}}
  const b=document.querySelector('[data-act="t-cam"]');
  if(b)b.className='call-btn'+(state.cameraOn?' on':'');
}
async function tScreen(){
  if(state.screenOn){screenTrack?.stop();screenTrack=null;state.screenOn=false;updVS();pScreen(false)}
  else{try{const st=await navigator.mediaDevices.getDisplayMedia({video:true});screenTrack=st.getVideoTracks()[0];screenTrack.onended=()=>{screenTrack=null;state.screenOn=false;updVS();const bb=document.querySelector('[data-act="t-scr"]');if(bb)bb.className='call-btn'};state.screenOn=true;updVS();pScreen(true)}catch(e){return}}
  const b=document.querySelector('[data-act="t-scr"]');
  if(b)b.className='call-btn'+(state.screenOn?' on':'');
}

function attLocal(){const v=document.getElementById('local-video');if(!v)return;const tr=screenTrack||cameraTrack;if(tr){v.style.display='block';if(v.srcObject!==new MediaStream([tr])){}v.srcObject=new MediaStream([tr]);v.muted=true;v.playsInline=true;v.play().catch(()=>{})}else{v.style.display='none';v.srcObject=null}}
function attachRemote(){const v=document.getElementById('remote-video');if(!v||!remoteStream)return;if(v.srcObject!==remoteStream)v.srcObject=remoteStream;v.muted=true;v.playsInline=true;v.play().catch(e=>console.warn('rv',e))}

async function startRec(){if(state.recording||!state.chatId)return;if(!navigator.mediaDevices||!window.MediaRecorder){toast('Не поддерживается');return}try{const st=await navigator.mediaDevices.getUserMedia({audio:true});state.recordStream=st;const mc=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4','audio/ogg'];let mime='';for(const m of mc){if(window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)){mime=m;break}}const r=new MediaRecorder(st,mime?{mimeType:mime}:undefined);state.mediaRecorder=r;state.recordedChunks=[];r.ondataavailable=e=>{if(e.data&&e.data.size>0)state.recordedChunks.push(e.data)};r.onstop=async()=>{const b=new Blob(state.recordedChunks,{type:r.mimeType||'audio/webm'});state.recordedChunks=[];cleanRec();if(b.size<512)return;if(b.size>MAX){toast('Большая');return}await upAudio(b)};r.start();state.recording=true;state.recordStart=Date.now();pRecStart();render();state.recordInterval=setInterval(()=>{const el=document.getElementById('rec-time');if(el)el.textContent=fmtD((Date.now()-state.recordStart)/1000)},250)}catch(e){toast('Микрофон: '+e.message);cleanRec();render()}}
function stopRec(send=true){if(!state.recording||!state.mediaRecorder)return;try{if(state.mediaRecorder.state!=='inactive'){if(!send)state.recordedChunks=[];state.mediaRecorder.stop()}}catch(e){}state.recording=false;if(!send)cleanRec();pRecStop();render()}
function cleanRec(){if(state.recordInterval){clearInterval(state.recordInterval);state.recordInterval=null}state.recordStream?.getTracks().forEach(x=>x.stop());state.recordStream=null;state.mediaRecorder=null;state.recording=false}
async function upAudio(b){try{const ext=b.type.includes('mp4')?'m4a':b.type.includes('ogg')?'ogg':'webm';const p=`chat/${state.chatId}/${uid()}.${ext}`;const u=await upMedia(p,b,(b.type||'audio/webm').split(';')[0]);await sb.from('messages').insert({chat_id:state.chatId,sender_id:state.user.id,content:null,media_url:u,media_type:'audio',media_name:`${t('voice')}.${ext}`,media_size:b.size});pSend()}catch(e){toast('Аудио: '+(e.message||e))}}

async function sendFile(f){if(!f||!state.chatId)return;if(f.size>MAX){toast('Файл больше '+fSize(MAX));return}try{const mime=f.type||'application/octet-stream';let b=f,p,mt,name=f.name||'file';if(mime.startsWith('image/')){mt='image';try{const d=await rImg(f,1600,0.82);b=d2b(d);p=`chat/${state.chatId}/${uid()}.jpg`}catch(e){const ext=(name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');p=`chat/${state.chatId}/${uid()}.${ext||'jpg'}`}}else{const ext=(name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');p=`chat/${state.chatId}/${uid()}.${ext||'bin'}`;if(mime.startsWith('audio/'))mt='audio';else if(mime.startsWith('video/'))mt='video';else mt='file'}const u=await upMedia(p,b,mime);await sb.from('messages').insert({chat_id:state.chatId,sender_id:state.user.id,content:null,media_url:u,media_type:mt,media_name:name,media_size:f.size});pSend()}catch(e){toast('Файл: '+(e.message||e))}}

async function genImg(){const i=document.getElementById('ai-image-prompt');if(!i)return;const pr=i.value.trim();if(!pr)return;const r=document.getElementById('ai-image-result');r.innerHTML=`<div class="muted small" style="text-align:center;padding:20px">⏳ ${t('improving')}</div>`;try{const tr=await fetch('https://text.pollinations.ai/'+encodeURIComponent(`Translate to English and enrich with visual details. Return ONLY the prompt: "${pr}"`));let en=(await tr.text()).trim().replace(/^["'`]|["'`]$/g,'').split('\n')[0].slice(0,220);if(!en||en.length<5)en=pr;r.innerHTML=`<div class="muted small" style="text-align:center;padding:20px">🎨 ${t('generating')}</div>`;const sd=Math.floor(Math.random()*1000000);const u=`https://image.pollinations.ai/prompt/${encodeURIComponent(en)}?width=1024&height=1024&nologo=true&seed=${sd}&model=flux`;const im=new Image();im.onload=()=>{r.innerHTML=`<img src="${u}" style="max-width:100%;border-radius:12px;margin-top:10px" data-act="open-ai-lb" data-src="${u}"><div class="row" style="margin-top:10px;gap:8px"><button class="btn ghost grow" data-act="ai-dl" data-src="${u}">${t('download')}</button><button class="btn primary grow" data-act="ai-to" data-src="${u}">${t('toChat')}</button></div>`};im.onerror=()=>{r.innerHTML='<div class="small" style="color:#ef4444;text-align:center;padding:14px">Ошибка</div>'};im.src=u}catch(e){r.innerHTML=`<div class="small" style="color:#ef4444;padding:14px">${esc(e.message)}</div>`}}

function render(){

document.body.classList.toggle('light',state.profile?.theme==='light');
const app=document.getElementById('app');
if(!state.user){app.innerHTML=renderAuth();return}
if(!state.profile){app.innerHTML=renderProfLoad();return}
const mi=document.getElementById('msg-input');const mv=mi?mi.value:null;
const saveIds=['a-login','a-user','a-name','a-pass','twofa-code','search-input','pick-search'];
const saved={};let focusId=null;
saveIds.forEach(fid=>{const el=document.getElementById(fid);if(el){saved[fid]=el.value;if(document.activeElement===el)focusId=fid}});
app.innerHTML=renderApp();
const nm=document.getElementById('msg-input');if(nm&&mv!==null){nm.value=mv;if(document.activeElement===mi)nm.focus()}
saveIds.forEach(fid=>{const el=document.getElementById(fid);if(el&&saved[fid]!==undefined)el.value=saved[fid]});
if(focusId){const el=document.getElementById(focusId);if(el)el.focus()}

attLocal();attachRemote();
if(state.call&&state.call.activeAt&&!callTimer){callTimer=setInterval(()=>{const el=document.getElementById('call-timer');if(!el||!state.call?.activeAt)return;const s=Math.floor((Date.now()-state.call.activeAt)/1000);el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500)}}
function renderProfLoad(){return `<div class="boot"><div class="ring"></div><div class="msg">Загрузка профиля…</div><div class="hint" style="max-width:340px;line-height:1.6">Если висит долго — проверьте, что Confirm email отключён в Supabase.</div><button class="btn primary" data-act="retry-prof" style="margin-top:14px">Повторить</button><button class="btn ghost" data-act="force-logout" style="margin-top:8px">← Назад на вход</button></div>`}
function renderAuth(){if(state.pending2FA)return `<div class="auth-wrap"><div class="auth-card"><div class="logo">🔐 2FA</div><div class="muted small">${t('twofaHint')}: <b>${esc(state.pending2FA.email)}</b></div><input id="twofa-code" placeholder="${t('twofaCode')}" maxlength="6" style="text-align:center;font-size:22px;letter-spacing:6px"><button class="btn primary" data-act="verify-2fa">${t('verify')}</button><button class="btn ghost" data-act="cancel-2fa">${t('back')}</button><div class="err">${esc(state.authErr)}</div></div></div>`;const reg=state.authMode==='register';return `<div class="auth-wrap"><div class="auth-card"><div class="logo">◈ Nova</div><div class="muted small">${reg?t('createAcc'):t('login')}</div>${reg?`<input id="a-user" placeholder="${t('username')}"><input id="a-name" placeholder="${t('displayName')}">`:''}<input id="a-login" placeholder="${t('email')}"><input id="a-pass" type="password" placeholder="${t('password')}"><button class="btn primary" data-act="do-auth">${reg?t('register'):t('login')}</button><button class="btn ghost" data-act="toggle-auth">${reg?t('haveAcc'):t('createAcc')}</button><div class="err">${esc(state.authErr)}</div></div></div>`}
function renderApp(){const u=state.profile;const tabs=[['chats','💬'],['stories','✨'],['contacts','👥'],['profile','⚙️']];const totalUnread=Object.values(state.unreadCounts).reduce((a,b)=>a+b,0);let ex='';if(state.showAI)ex+=renderAI();if(state.showBlocked)ex+=renderBlocked();if(state.aiModal==='image')ex+=renderImgModal();return `<header class="top">${aHtml(u)}<div class="grow"><b>${esc(u.display_name||u.username)}</b><div class="muted small">@${esc(u.username)}</div></div></header><main class="content ${state.chatId?'chat':''}">${state.chatId?renderChat():renderTab()}</main>${state.chatId?'':`<nav class="tabs">${tabs.map(([k,l])=>{const badge=k==='chats'&&totalUnread>0?`<span class="tab-badge">${totalUnread>99?'99+':totalUnread}</span>`:'';return `<button class="tab ${state.tab===k?'on':''}" data-act="tab" data-tab="${k}">${l}<br>${t(k)}${badge}</button>`}).join('')}</nav>`}${state.tab==='chats'&&!state.chatId?`<button class="floating-ai" data-act="open-ai">🤖</button>`:''}${state.modal==='pick'?renderPick():''}${state.modal==='search'?renderSearchModal():''}${state.createGroup?renderCreate():''}${state.viewMembers?renderMembers():''}${state.groupSettings?renderGroupSet():''}${state.storyCompose?renderStoryComp():''}${state.msgMenu?renderMsgMenu():''}${state.viewStory?renderStoryView():''}${state.viewProfile?renderProfileView():''}${state.incoming?renderIncoming():''}${state.call?renderCall():''}${state.lightbox?`<div class="lightbox" data-act="close-lb"><img src="${state.lightbox}"></div>`:''}${ex}`}
function renderTab(){if(state.tab==='stories')return renderStories();if(state.tab==='contacts')return renderContactsTab();if(state.tab==='profile')return renderProfile();return renderChats()}

function renderChats(){const seen=new Set();const list=state.chats.filter(c=>{if(!c||seen.has(c.id))return false;seen.add(c.id);return true});let h=`<div class="row between"><h2>${t('chats')}</h2><div class="row"><button class="btn small ghost" data-act="new-group">${t('newGroup')}</button><button class="btn small" data-act="new-chat">${t('newChat')}</button></div></div>`;if(state.missedCalls.length){h+=`<div class="banner" style="border-color:#ef4444;background:rgba(239,68,68,.1)"><div><b>📞 ${t('missedCalls')}</b></div>${state.missedCalls.slice(0,3).map(c=>{const caller=state.profiles[c.caller_id];return `<div class="row between"><span>${esc(caller?.display_name||'?')} · ${tm(c.created_at)}</span><button class="btn small success" data-act="callback" data-id="${c.caller_id}">${t('callBack')}</button></div>`}).join('')}</div>`}if(!list.length)h+=`<div class="empty">${t('noChats')}</div>`;h+='<div class="list">';for(const c of list){const m=state.members[c.id]||[];const o=m.find(x=>x.user_id!==state.user.id);if(o&&isBlocked(o.user_id))continue;const op=o?state.profiles[o.user_id]:null;const ti=c.is_group?c.name:(op?.display_name||'Чат');const av=c.is_group?{avatar_url:c.avatar_url||null,accent_color:'#f59e0b',display_name:c.name}:(op||{});const ls=!c.is_group&&op?fLastSeen(op):'';const unread=state.unreadCounts[c.id]||0;h+=`<div class="item ${unread>0?'unread':''}" data-act="open-chat" data-id="${c.id}">${aHtml(av)}<div class="grow"><b>${esc(ti)}</b><div class="muted small">${c.is_group?`${m.length} ${t('members').toLowerCase()}`:(ls||'@'+esc(op?.username||'—'))}</div></div>${unread>0?`<span class="item-badge">${unread>99?'99+':unread}</span>`:''}</div>`}return h+'</div>'}
function renderContactsTab(){const mc=state.contacts.map(c=>state.profiles[c.contact_id]).filter(Boolean);let h=`<div class="row between"><h2>${t('contacts')} (${mc.length})</h2><button class="btn small" data-act="search-friends">🔍</button></div>`;if(!mc.length)h+=`<div class="empty">${t('noContacts')}</div>`;h+='<div class="list">';for(const p of mc){const ls=fLastSeen(p);h+=`<div class="item" data-act="open-contact-chat" data-id="${p.id}">${aHtml(p)}<div class="grow"><b>${esc(p.display_name||p.username)}</b><div class="muted small">${ls||('@'+esc(p.username))}</div></div><button class="icon" data-act="rm-contact" data-id="${p.id}">✕</button></div>`}return h+'</div>'}
function renderSearchModal(){return `<div class="overlay"><div class="card modal"><div class="row between"><b>${t('searchFriends')}</b><button class="icon" data-act="close-modal">✕</button></div><input id="search-input" placeholder="${t('search')}" value="${esc(state.searchQuery||'')}" data-act="search-input" autofocus><div id="search-results">${renderSearchResults()}</div></div></div>`}
function renderSearchResults(){const r=state.searchResults;if(r===null)return `<div class="empty">${t('searchEmpty')}</div>`;if(!r.length)return `<div class="empty">${t('noResults')}</div>`;return '<div class="list">'+r.map(p=>`<div class="item" data-act="open-contact-chat" data-id="${p.id}">${aHtml(p)}<div class="grow"><b>${esc(p.display_name||p.username)}</b><div class="muted small">@${esc(p.username)}${p.phone?' · '+esc(p.phone):''}</div></div>${isContact(p.id)?'':`<button class="btn small success" data-act="add-contact" data-id="${p.id}">${t('add')}</button>`}</div>`).join('')+'</div>'}
function renderAI(){return `<div class="overlay"><div class="card modal" style="max-width:600px"><div class="row between"><b>🤖 AI</b><button class="icon" data-act="close-ai">✕</button></div><div class="ai-chat"><div class="ai-messages" id="ai-messages">${state.aiMessages.length===0?`<div class="empty">${esc(t('aiGreeting')).replace(/\n/g,'<br>')}</div>`:''}${state.aiMessages.map(m=>`<div class="ai-msg ${m.role}">${m.image?`<img src="${m.image}">`:''}${esc(m.content||'').replace(/\n/g,'<br>')}</div>`).join('')}${state.aiLoading?`<div class="ai-msg assistant"><span class="muted">${t('aiThinking')}</span></div>`:''}</div><div class="ai-composer"><button class="icon-btn" data-act="ai-image">🎨</button><button class="icon-btn" data-act="ai-clear">🧹</button><input id="ai-input" placeholder="${t('aiPlaceholder')}"><button class="btn primary" data-act="ai-send" style="padding:10px 16px">➤</button></div></div></div></div>`}
function renderImgModal(){return `<div class="overlay"><div class="card modal"><div class="row between"><b>🎨</b><button class="icon" data-act="close-ai-image">✕</button></div><input id="ai-image-prompt" placeholder="${t('describeImage')}"><button class="btn primary wide" data-act="ai-image-go">${t('generate')}</button><div id="ai-image-result"></div></div></div>`}
function renderBlocked(){const bl=state.blocks.map(b=>state.profiles[b.blocked_id]).filter(Boolean);return `<div class="overlay"><div class="card modal"><div class="row between"><b>${t('blocked')} (${bl.length})</b><button class="icon" data-act="close-blocked">✕</button></div>${bl.length?bl.map(p=>`<div class="member-row">${aHtml(p,'sm')}<div class="grow"><b>${esc(p.display_name||p.username)}</b></div><button class="btn small ghost" data-act="unblock" data-id="${p.id}">${t('unblock')}</button></div>`).join(''):`<div class="empty">${t('noUsers')}</div>`}</div></div>`}
function renderMsgBody(m){let o='';const u=m.media_url||'';const n=m.media_name||'file';const s=m.media_size?fSize(m.media_size):'';if(u&&m.media_type==='image')o+=`<img class="msg-image" src="${u}" data-act="open-lb" data-src="${u}">`;else if(u&&m.media_type==='audio')o+=`<audio controls preload="metadata" src="${u}"></audio>`;else if(u&&m.media_type==='video')o+=`<video controls preload="metadata" src="${u}"></video>`;else if(u&&m.media_type==='file')o+=`<a class="file-link" href="${u}" target="_blank" download="${esc(n)}"><span class="file-icon">📎</span><span class="file-info"><span class="file-name">${esc(n)}</span><span class="file-size">${s}</span></span></a>`;if(m.content)o+=`<div>${linkify(m.content)}${m.edited_at?'<span class="edited-mark">(изм.)</span>':''}</div>`;else if(m.edited_at)o+=`<span class="edited-mark">(изм.)</span>`;return o}
function renderChat(){const c=state.chat;if(!c)return '';const m=state.members[c.id]||[];const o=m.find(x=>x.user_id!==state.user.id);const op=o?state.profiles[o.user_id]:null;const ti=c.is_group?c.name:(op?.display_name||'Чат');const av=c.is_group?{avatar_url:c.avatar_url||null,accent_color:'#f59e0b',display_name:c.name}:(op||{});const mm=(m.find(x=>x.user_id===state.user.id)||{}).muted;const msgs=state.messages;const u=state.user;let bn='';if(!c.is_group&&o&&!isContact(o.user_id)&&!isBlocked(o.user_id)){const om=msgs.find(x=>x.sender_id===o.user_id);if(om)bn=`<div class="banner"><div><b>${t('addToContacts')}</b></div><div class="row"><button class="btn small success grow" data-act="bn-add" data-id="${o.user_id}">${t('add')}</button><button class="btn small danger grow" data-act="bn-block" data-id="${o.user_id}">${t('block')}</button></div></div>`}if(!c.is_group&&o&&isBlocked(o.user_id)){bn=`<div class="banner"><div class="muted">${t('youBlocked')} ${esc(op?.display_name||'?')}</div><button class="btn small ghost" data-act="unblock" data-id="${o.user_id}">${t('unblock')}</button></div>`}const comp=state.recording?`<div class="rec-bar"><span>●</span><span class="time" id="rec-time">00:00</span><div class="grow"></div><button class="btn small ghost" data-act="cancel-rec" style="color:#fff;border-color:rgba(255,255,255,.4)">Отмена</button><button class="btn small" data-act="stop-rec" style="background:#fff;color:#ef4444;border-color:#fff">Стоп</button></div>`:`<button class="icon-btn" data-act="attach-file">📎</button><input type="file" id="chat-file" accept="*/*" style="display:none"><input id="msg-input" placeholder="${mm?t('mutedByAdmin'):t('typeMessage')}" ${mm?'disabled':''}><button class="icon-btn" data-act="start-rec" ${mm?'disabled':''}>🎤</button><button class="btn primary" data-act="send" ${mm?'disabled':''}>➤</button>`;const ab=c.is_group?`<span data-act="open-gs" style="cursor:pointer">${aHtml(av,'sm')}</span>`:`<span data-act="view-prof" data-id="${o?.user_id||''}" style="cursor:pointer">${aHtml(av,'sm')}</span>`;const sb2=c.is_group?`${m.length} ${t('members').toLowerCase()}`:(op?fLastSeen(op)||('@'+esc(op.username)):'—');const eb=c.is_group&&isAdmin(c.id)?`<button class="icon" data-act="open-gs">⚙️</button>`:'';return `<div class="chat-head"><button class="icon" data-act="back">←</button>${ab}<div class="grow"><b>${esc(ti)}</b><div class="muted small">${sb2}</div></div>${eb}${!c.is_group&&o?`<button class="icon" data-act="call" data-id="${o.user_id}">📞</button>`:''}</div>${bn}<div class="messages" id="msgs">${msgs.length?msgs.map(m=>{const out=m.sender_id===u.id;const snd=state.profiles[m.sender_id];const r=m.reactions||{};const rH=Object.entries(r).length?`<div class="reactions">${Object.entries(r).map(([e,a])=>`<button class="reaction-chip ${a.includes(u.id)?'mine':''}" data-act="react-msg" data-id="${m.id}" data-v="${e}">${e} ${a.length}</button>`).join('')}</div>`:'';return `<div class="msg-row ${out?'out':'in'}"><div class="msg ${out?'out':'in'}">${c.is_group&&!out?`<div class="sender-name">${esc(snd?.display_name||'?')}</div>`:''}<div class="bubble">${renderMsgBody(m)}</div>${rH}<div class="ts">${tm(m.created_at)}</div></div><button class="msg-menu-btn" data-act="msg-menu" data-id="${m.id}">⋯</button></div>`}).join(''):'<div class="empty">👋</div>'}</div>${mm?`<div class="muted small" style="text-align:center;padding:8px">${t('mutedByAdmin')}</div>`:''}<div class="composer">${comp}</div>`}
function renderStories(){let h=`<div class="row between"><h2>${t('stories')}</h2><button class="btn small" data-act="add-story">${t('addStory')}</button></div>`;if(!state.stories.length)h+=`<div class="empty">${t('noStories')}</div>`;h+='<div class="stories-row">';for(const s of state.stories){const au=state.profiles[s.user_id];if(!au)continue;const bg=s.media_url?`background-image:url(${s.media_url});background-size:cover;background-position:center`:`background:${s.background_color||'#6366f1'}`;h+=`<div class="story" data-act="view-story" data-id="${s.id}" style="${bg}">${aHtml(au,'xs','background:rgba(0,0,0,.35);')}<div><div>${esc(au.display_name)}</div><div class="small" style="opacity:.8">${tm(s.created_at)}</div></div></div>`}return h+'</div>'}
function renderProfile(){const u=state.profile;const ac=['#6366f1','#ec4899','#10b981','#f59e0b','#3b82f6','#ef4444','#8b5cf6','#14b8a6'];const lg=[['ru','Русский'],['en','English']];const notifState=('Notification' in window)?Notification.permission:'denied';return `<h2>${t('profile')}</h2><div class="card"><div class="row">${aHtml(u,'big')}<div class="grow"><input id="p-name" value="${esc(u.display_name||'')}" placeholder="${t('displayName')}"><input id="p-bio" value="${esc(u.bio||'')}" placeholder="${t('bio')}" style="margin-top:8px"><input id="p-phone" value="${esc(u.phone||'')}" placeholder="+7 ..." style="margin-top:8px"></div></div><button class="btn ghost" data-act="pick-av">${t('photoOnAvatar')}</button><input type="file" id="avatar-file" accept="image/*" style="display:none"><div class="lbl">${t('accent')}</div><div class="chips">${ac.map(c=>`<button class="dot ${u.accent_color===c?'on':''}" style="background:${c}" data-act="set-accent" data-v="${c}"></button>`).join('')}</div><button class="btn primary wide" data-act="save-prof">${t('saveProfile')}</button></div><div class="card"><div class="lbl">${t('notification')}</div>${notifState==='granted'?`<div class="small" style="color:var(--online)">✓ ${t('notifOn')}</div>`:notifState==='denied'?`<div class="small" style="color:#ef4444">${t('notifBlocked')}</div>`:`<button class="btn ghost" data-act="allow-notif">${t('allowNotif')}</button>`}<div class="lbl">${t('appearance')}</div><button class="btn ghost" data-act="toggle-theme">${t('theme')}: ${u.theme==='light'?'☀️':'🌙'}</button><div class="row" style="gap:8px"><button class="btn ghost grow" data-act="fs-minus">A −</button><button class="btn ghost grow" data-act="fs-plus">A +</button></div><div class="lbl">${t('lang')}</div><div class="chips">${lg.map(([k,l])=>`<button class="btn small ${S.lang===k?'primary':'ghost'}" data-act="set-lang" data-v="${k}">${l}</button>`).join('')}</div><div class="lbl">${t('settings')}</div><button class="btn ghost" data-act="toggle-sounds">${S.sounds?t('soundsOn'):t('soundsOff')}</button><button class="btn ghost" data-act="toggle-notif">${S.notifications?t('notifOn'):t('notifOff')}</button><div class="lbl">${t('privacy')}</div><div class="small">${t('lastSeenPrivacy')}</div><select data-act="set-priv-ls" style="margin-bottom:8px">${['everyone','contacts','nobody'].map(v=>`<option value="${v}" ${(u.privacy_last_seen||'everyone')===v?'selected':''}>${t(v)}</option>`).join('')}</select><div class="small">${t('messagesPrivacy')}</div><select data-act="set-priv-msg">${['everyone','contacts','nobody'].map(v=>`<option value="${v}" ${(u.privacy_messages||'everyone')===v?'selected':''}>${t(v)}</option>`).join('')}</select><div class="lbl">${t('storySettings')}</div><div class="small">${t('storyTtl')}</div><select data-act="set-ttl">${[1,6,12,24,48,72].map(h=>`<option value="${h}" ${(u.story_ttl_hours||24)===h?'selected':''}>${h} ${t('hours')}</option>`).join('')}</select><div class="lbl">${t('twofa')}</div><button class="btn ghost" data-act="${u.twofa_enabled?'disable-2fa':'enable-2fa'}">${u.twofa_enabled?t('twofaOn'):t('twofaOff')}</button><button class="btn ghost" data-act="show-blocked">${t('blocked')} (${state.blocks.length})</button><div style="height:10px"></div><button class="btn ghost" data-act="clear-cache">${t('cache')}</button><button class="btn danger wide" data-act="delete-account">🗑️ ${t('deleteAcc')}</button><button class="btn ghost" data-act="logout">${t('logout')}</button></div>`}
function renderPick(){return `<div class="overlay"><div class="card modal"><div class="row between"><b>${state.pickMode==='call'?'📞':t('newChat')}</b><button class="icon" data-act="close-modal">✕</button></div><input id="pick-search" placeholder="${t('search')}" value="${esc(state.searchQuery||'')}" data-act="pick-search-input" autofocus><div id="pick-list">${renderPickList()}</div></div></div>`}
function renderPickList(){const q=(state.searchQuery||'').toLowerCase().trim();const contactIds=state.contacts.map(c=>c.contact_id);const u=Object.values(state.profiles).filter(p=>p.id!==state.user.id);const f=q?u.filter(x=>(x.display_name||'').toLowerCase().includes(q)||(x.username||'').toLowerCase().includes(q)||(x.phone||'').includes(q)||(x.email||'').toLowerCase().includes(q)):u;if(!f.length)return `<div class="empty">${t('noUsers')}</div>`;return f.map(x=>`<div class="item" data-act="pick-user" data-id="${x.id}">${aHtml(x)}<div class="grow"><b>${esc(x.display_name||x.username)}</b><div class="muted small">${fLastSeen(x)||('@'+esc(x.username))}${x.phone?' · '+esc(x.phone):''}</div></div></div>`).join('')}

// ГРУППА: только контакты
function renderCreate(){
  const contactIds=state.contacts.map(c=>c.contact_id);
  const u=Object.values(state.profiles).filter(p=>p.id!==state.user.id && contactIds.includes(p.id));
  if(!u.length)return `<div class="overlay"><div class="card modal"><div class="row between"><b>${t('newGroup')}</b><button class="icon" data-act="close-modal">✕</button></div><div class="empty">${t('addContactsFirst')}</div></div></div>`;
  return `<div class="overlay"><div class="card modal"><div class="row between"><b>${t('newGroup')}</b><button class="icon" data-act="close-modal">✕</button></div><input id="g-name" placeholder="${t('groupName')}" value="${esc(state.groupName)}"><div class="lbl">${t('pickMembers')}</div>${u.map(x=>`<label class="item" style="cursor:pointer">${aHtml(x,'xs')}<div class="grow"><b>${esc(x.display_name||x.username)}</b></div><input type="checkbox" data-act="toggle-member" data-id="${x.id}" ${state.groupMembers.includes(x.id)?'checked':''} style="width:auto"></label>`).join('')}<button class="btn primary wide" data-act="create-group-btn">${t('create')}</button></div></div>`;
}

async function doAuth(){
  const lrEl=document.getElementById('a-login');
  const pwEl=document.getElementById('a-pass');
  const errEl=document.querySelector('.err');
  if(!lrEl||!pwEl)return;
  const lr=lrEl.value, pw=pwEl.value;
  const showErr=m=>{if(errEl)errEl.textContent=m;state.authErr=m};
  if(!pw){showErr('Введите пароль');return}
  const id=detId(lr);
  if(!id){showErr('Введите email или корректный телефон');return}
  try{
    if(state.authMode==='register'){
      const unEl=document.getElementById('a-user');
      const nmEl=document.getElementById('a-name');
      const un=unEl?.value.trim();
      const nm=nmEl?.value.trim();
      if(!un){showErr('Введите логин');return}
      const {user,session}=await signUp(id.email,pw,un,nm||un);
      if(!session){showErr('Регистрация не завершена. Отключите Confirm email в Supabase (Authentication → Providers → Email).');return}
      state.user=session.user||user;
      await loadProf();
      if(!state.profile){showErr('Профиль не создан. Проверьте триггер handle_new_user.');return}
      if(id.type==='phone'){await sb.from('profiles').update({phone:id.value}).eq('id',state.user.id);state.profile.phone=id.value}
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email:id.email,password:pw});
      if(error)throw error;
      if(!data.session){showErr('Сессия не создана. Email не подтверждён.');return}
      state.user=data.session.user;
      await loadProf();
      if(!state.profile){showErr('Профиль не найден.');return}
    }
    state.authErr='';
    await boot();
  }catch(e){showErr(e.message||String(e))}
}
async function boot(){await loadProf();if(!state.profile){render();return}await loadChats();await loadStories();await loadAll();await loadContacts();await loadBlocks();await loadUnread();await checkMissedCalls();await loadMissedCalls();subCalls();subProfiles();startHeartbeat();if(refreshInterval)clearInterval(refreshInterval);refreshInterval=setInterval(async()=>{if(!state.chatId&&!document.hidden){await loadUnread();render()}},30000);render()}

});

document.addEventListener('change',async e=>{
if(e.target.id==='avatar-file'){const f=e.target.files[0];if(!f)return;try{const d=await rImg(f,300,0.85);const b=d2b(d);const p=`avatars/${state.user.id}.jpg`;const {error:ue}=await sb.storage.from('media').upload(p,b,{upsert:true,contentType:'image/jpeg'});if(ue){toast(ue.message);return}const {data:ud}=sb.storage.from('media').getPublicUrl(p);await sb.from('profiles').update({avatar_url:ud.publicUrl+'?t='+Date.now()}).eq('id',state.user.id);await loadProf();render()}catch(err){toast(err.message)}e.target.value=''}
if(e.target.id==='group-avatar-file'){const f=e.target.files[0];if(!f||!state.groupSettings)return;try{const d=await rImg(f,300,0.85);const b=d2b(d);const p=`groups/${state.groupSettings}.jpg`;const {error:ue}=await sb.storage.from('media').upload(p,b,{upsert:true,contentType:'image/jpeg'});if(ue){toast(ue.message);return}const {data:ud}=sb.storage.from('media').getPublicUrl(p);await sb.from('chats').update({avatar_url:ud.publicUrl+'?t='+Date.now()}).eq('id',state.groupSettings);await refresh();render()}catch(err){toast(err.message)}e.target.value=''}
if(e.target.id==='story-file'){const f=e.target.files[0];if(!f)return;try{state.storyMedia=await rImg(f,800,0.75);render()}catch(err){toast(err.message)}e.target.value=''}
if(e.target.id==='chat-file'){const f=e.target.files[0];if(!f)return;await sendFile(f);e.target.value=''}
if(e.target.dataset.act==='set-priv-ls'){await sb.from('profiles').update({privacy_last_seen:e.target.value}).eq('id',state.user.id);await loadProf();render()}
if(e.target.dataset.act==='set-priv-msg'){await sb.from('profiles').update({privacy_messages:e.target.value}).eq('id',state.user.id);await loadProf();render()}
if(e.target.dataset.act==='set-ttl'){await sb.from('profiles').update({story_ttl_hours:parseInt(e.target.value)}).eq('id',state.user.id);await loadProf();render()}
});

document.addEventListener('input',e=>{
if(e.target.dataset.act==='search-input'){state.searchQuery=e.target.value;clearTimeout(window._st);window._st=setTimeout(()=>searchUsers(state.searchQuery),400)}
if(e.target.dataset.act==='pick-search-input'){state.searchQuery=e.target.value;const l=document.getElementById('pick-list');if(l)l.innerHTML=renderPickList()}
});

document.addEventListener('keydown',e=>{
if(e.key==='Enter'&&e.target.id==='msg-input'){e.preventDefault();sendMsg()}
if(e.key==='Enter'&&e.target.id==='ai-input'){e.preventDefault();sendAI()}
if(e.key==='Enter'&&e.target.id==='twofa-code'){e.preventDefault();document.querySelector('[data-act="verify-2fa"]')?.click()}
});

window.addEventListener('beforeunload',()=>{if(state.recording){try{state.mediaRecorder?.stop()}catch(e){}cleanRec()}if(sigPollTimer)clearInterval(sigPollTimer);if(heartbeatTimer)clearInterval(heartbeatTimer);if(refreshInterval)clearInterval(refreshInterval)});
sb.auth.onAuthStateChange(async(ev,ss)=>{if(ev==='SIGNED_OUT'){const w=!!state.user;state.user=null;state.profile=null;if(w)render()}if(ev==='TOKEN_REFRESHED'&&ss?.user)state.user=ss.user;if(ev==='SIGNED_IN'&&ss?.user&&!state.user)state.user=ss.user});

(async()=>{try{await loadSess();if(state.user)await loadProf();if(state.user&&state.profile)await boot();else render()}catch(e){console.error('BOOT',e);fatal('Ошибка',String(e.message||e),'F12 → Console')}})();
})();
</script>
</body>
</html>
