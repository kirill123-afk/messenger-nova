<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Nova Messenger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root{--accent:#6366f1;--bg:#0e1015;--card:#171a22;--text:#e9ecf3;--muted:#8a92a6;--line:#242835;--font-scale:1;--online:#10b981}
body.light{--bg:#f4f5f9;--card:#fff;--text:#14161c;--muted:#6b7280;--line:#e6e8ef}
html,body{height:100%}
body{background:var(--bg);color:var(--text);overflow:hidden;font-size:calc(14px * var(--font-scale))}
#app{height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:12px} .grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between}
.btn{background:var(--card);border:1px solid var(--line);padding:12px 16px;border-radius:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.success{background:#10b981;border-color:#10b981;color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{background:#ef4444;border-color:#ef4444;color:#fff}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.icon{padding:8px;border-radius:10px;font-size:18px}
.auth-wrap{flex:1;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px}
.logo{font-size:26px;font-weight:800;letter-spacing:.5px;color:var(--accent)}
.err{color:#ef4444;font-size:13px;min-height:18px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.ava{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;background-size:cover;background-position:center;overflow:hidden;position:relative}
.ava.sm{width:34px;height:34px;font-size:17px;border-radius:12px}
.ava.big{width:64px;height:64px;font-size:30px;border-radius:20px}
.ava.xs{width:26px;height:26px;font-size:14px;border-radius:9px}
.ava.huge{width:110px;height:110px;font-size:54px;border-radius:36px}
.ava-online::after{content:'';position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;background:var(--online);border:2px solid var(--card);border-radius:50%}
.content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.content.chat{padding:0;gap:0}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card)}
.tab{flex:1;padding:10px 4px;font-size:11px;color:var(--muted)}
.tab.on{color:var(--accent);font-weight:600}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg-row{display:flex;gap:6px;align-items:flex-end;max-width:88%}
.msg-row.in{align-self:flex-start}
.msg-row.out{align-self:flex-end;flex-direction:row-reverse}
.msg-menu-btn{font-size:16px;color:var(--muted);opacity:0;padding:4px}
.msg-row:hover .msg-menu-btn{opacity:1}
.msg{display:flex;flex-direction:column;min-width:0;max-width:100%}
.msg.out{align-items:flex-end}
.msg.in{align-items:flex-start}
.bubble{padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);word-break:break-word;max-width:100%}
.msg.out .bubble{background:var(--accent);border-color:var(--accent);color:#fff}
.bubble img.msg-image{max-width:260px;max-height:260px;border-radius:12px;display:block;margin-bottom:6px;object-fit:cover;cursor:pointer}
.bubble audio{max-width:260px;display:block;margin-bottom:4px}
.bubble video{max-width:280px;max-height:240px;border-radius:12px;display:block;margin-bottom:6px;background:#000}
.file-link{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:rgba(0,0,0,.25);text-decoration:none;color:inherit;margin-bottom:6px;max-width:280px}
.file-icon{font-size:22px;flex:none}
.file-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px}
.file-size{display:block;font-size:11px;opacity:.7}
.sender-name{font-size:11px;color:var(--accent);margin-bottom:2px;font-weight:600}
.edited-mark{opacity:.7;font-size:11px;margin-left:4px}
.ts{font-size:11px;color:var(--muted);margin-top:3px}
.reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.reaction-chip{padding:2px 8px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px;cursor:pointer}
.reaction-chip.mine{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 25%,transparent)}
.composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);align-items:center}
.composer .icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--bg);border:1px solid var(--line);flex:none}
.rec-bar{display:flex;align-items:center;gap:10px;flex:1;background:#ef4444;color:#fff;padding:10px 14px;border-radius:12px;font-weight:600}
.rec-bar .time{font-variant-numeric:tabular-nums}
.stories-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.story{min-width:104px;height:150px;border-radius:18px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;font-weight:600;font-size:13px;cursor:pointer;background-size:cover;background-position:center;position:relative;overflow:hidden}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;z-index:50}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal{width:100%;max-width:460px;max-height:85vh;overflow:auto;position:relative}
.call{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;min-width:280px;max-width:520px}
.call-controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.call-btn{width:52px;height:52px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px;display:grid;place-items:center}
.call-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.call-btn.off{background:#ef4444;border-color:#ef4444;color:#fff}
.call-btn.danger{background:#ef4444;border-color:#ef4444;color:#fff}
#remote-video{width:100%;max-height:45vh;border-radius:16px;background:#111;object-fit:contain}
#local-video{position:absolute;bottom:8px;right:8px;width:110px;height:80px;border-radius:10px;object-fit:cover;background:#000;border:1px solid var(--line);display:none}
.video-wrap{position:relative;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 10px;border-radius:12px;border:1px solid var(--line);font-size:18px}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.dot.on{border-color:var(--text)}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.story-full{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:space-between;padding:20px;color:#fff;font-size:18px;font-weight:600}
.preview-media{width:100%;max-height:200px;object-fit:cover;border-radius:12px;display:block}
.badge{font-size:10px;padding:2px 6px;border-radius:6px;background:var(--line);color:var(--text)}
.badge.admin{background:#f59e0b;color:#000}
.badge.muted{background:#ef4444;color:#fff}
.member-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:var(--bg)}
.member-actions{display:flex;gap:6px;flex-wrap:wrap}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.boot{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;background:var(--bg);color:var(--text)}
.boot .ring{width:52px;height:52px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
.boot .msg{font-size:15px;font-weight:600}
.boot .hint{font-size:12px;color:var(--muted);max-width:340px;line-height:1.5}
.boot .fatal-title{color:#ef4444;font-size:18px;font-weight:700;margin-bottom:8px}
.boot .fatal-text{font-size:14px;line-height:1.6;max-width:480px}
.boot .fatal-hint{font-size:13px;color:var(--muted);line-height:1.6;max-width:480px;margin-top:14px}
.boot code{background:var(--line);padding:2px 6px;border-radius:6px;font-size:12px}
.ai-chat{display:flex;flex-direction:column;height:calc(100dvh - 130px);background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ai-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.ai-msg.user{align-self:flex-end;background:var(--accent);color:#fff}
.ai-msg.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.ai-msg img{max-width:100%;border-radius:10px;margin-bottom:6px;display:block}
.ai-composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:center}
.ai-composer .icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--bg);border:1px solid var(--line);flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

  function setupWebRTC(){
    if(!state.call||pc||!state.stream)return;
    const isCaller=state.call.outbound;
    pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]});

  }

      for(const m of mimeCandidates){if(window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)){mime=m;break}}
      const rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);state.mediaRecorder=rec;state.recordedChunks=[];
      rec.ondataavailable=e=>{if(e.data&&e.data.size>0)state.recordedChunks.push(e.data)};
      rec.onstop=async()=>{const blob=new Blob(state.recordedChunks,{type:rec.mimeType||'audio/webm'});state.recordedChunks=[];cleanupRecordUI();if(blob.size<512){showToast('Короткая');return}if(blob.size>MAX_UPLOAD_BYTES){showToast('Большая');return}await uploadAndSendAudio(blob)};
      rec.start();state.recording=true;state.recordStart=Date.now();playRecStart();render();
      state.recordInterval=setInterval(()=>{const el=document.getElementById('rec-time');if(el)el.textContent=fmtDur((Date.now()-state.recordStart)/1000)},250);
    }catch(e){showToast('Микрофон: '+e.message);cleanupRecordUI();render()}
  }
  function stopRecording(send=true){if(!state.recording||!state.mediaRecorder)return;try{if(state.mediaRecorder.state!=='inactive'){if(!send)state.recordedChunks=[];state.mediaRecorder.stop()}}catch(e){}state.recording=false;if(!send){cleanupRecordUI();playRecStop()}else{playRecStop()}render()}
  function cleanupRecordUI(){if(state.recordInterval){clearInterval(state.recordInterval);state.recordInterval=null}state.recordStream?.getTracks().forEach(t=>t.stop());state.recordStream=null;state.mediaRecorder=null;state.recording=false}
  async function uploadAndSendAudio(blob){try{const ext=blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm';const path=`chat/${state.chatId}/${uid()}.${ext}`;const cleanType=(blob.type||'audio/webm').split(';')[0];const url=await uploadMedia(path,blob,cleanType);const {error}=await sb.from('messages').insert({chat_id:state.chatId,sender_id:state.user.id,content:null,media_url:url,media_type:'audio',media_name:`${t('voice')}.${ext}`,media_size:blob.size});if(error){showToast('Send: '+error.message);return}playSend()}catch(e){showToast('Аудио: '+(e.message||e))}}

  /* ============ ФАЙЛЫ ============ */
  async function sendChatFile(file){
    if(!file||!state.chatId)return;if(file.size>MAX_UPLOAD_BYTES){showToast('Файл больше '+formatSize(MAX_UPLOAD_BYTES));return}
    try{
      const mime=file.type||'application/octet-stream';let blob=file,path,mediaType,name=file.name||'file';
      if(mime.startsWith('image/')){mediaType='image';try{const data=await resizeImage(file,1600,0.82);blob=dataURLtoBlob(data);path=`chat/${state.chatId}/${uid()}.jpg`}catch(e){const ext=(name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');path=`chat/${state.chatId}/${uid()}.${ext||'jpg'}`}}
      else{const ext=(name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');path=`chat/${state.chatId}/${uid()}.${ext||'bin'}`;if(mime.startsWith('audio/'))mediaType='audio';else if(mime.startsWith('video/'))mediaType='video';else mediaType='file'}
      const url=await uploadMedia(path,blob,mime);
      const {error}=await sb.from('messages').insert({chat_id:state.chatId,sender_id:state.user.id,content:null,media_url:url,media_type:mediaType,media_name:name,media_size:file.size});
      if(error){showToast('Send: '+error.message);return}playSend();
    }catch(e){showToast('Файл: '+(e.message||e))}
  }

  async function sendAIMessage(){
    const inp=document.getElementById('ai-input');const text=inp.value.trim();
    if(!text||state.aiLoading)return;
    inp.value='';
    state.aiMessages.push({role:'user',content:text});
    state.aiLoading=true;saveAIHistory();render();
    try{
      const sysPrompt=userSettings.lang==='en'?'You are a helpful AI assistant in the Nova messenger. Respond in English, briefly and to the point. You can write poems, songs, code, advice.':'Ты полезный AI-ассистент в мессенджере Nova. Отвечай на русском, кратко и по делу. Можешь писать стихи, песни, код, советы.';
      const res=await fetch('https://text.pollinations.ai/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:sysPrompt},...state.aiMessages.slice(-20).map(m=>({role:m.role,content:m.content||''}))],model:'openai'})});
      if(!res.ok)throw new Error('HTTP '+res.status);
      const answer=(await res.text()).trim();
      state.aiMessages.push({role:'assistant',content:answer||'...'});
    }catch(e){state.aiMessages.push({role:'assistant',content:'⚠ '+e.message})}

  async function generateAIImage(){
    const inp=document.getElementById('ai-image-prompt');if(!inp)return;
    const prompt=inp.value.trim();if(!prompt)return;
    const result=document.getElementById('ai-image-result');
    result.innerHTML=`<div class="muted small" style="text-align:center;padding:20px">⏳ ${t('improving')}</div>`;
    try{
      // Переводим промпт на английский и обогащаем
      const translateResp=await fetch('https://text.pollinations.ai/'+encodeURIComponent(`Translate to English and enrich with visual details (style, lighting, quality, mood). Return ONLY the final English prompt, one sentence, no explanations, no quotes: "${prompt}"`));
      let englishPrompt=(await translateResp.text()).trim().replace(/^["'`]|["'`]$/g,'').split('\n')[0].slice(0,220);
      if(!englishPrompt||englishPrompt.length<5)englishPrompt=prompt;
      console.log('Original:',prompt,'\nTranslated:',englishPrompt);
      result.innerHTML=`<div class="muted small" style="text-align:center;padding:20px">🎨 ${t('generating')}<br><span style="opacity:.6;font-size:11px">${esc(englishPrompt)}</span></div>`;
      const seed=Math.floor(Math.random()*1000000);
      const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(englishPrompt)}?width=1024&height=1024&nologo=true&seed=${seed}&model=flux`;
      const img=new Image();
      img.onload=()=>{
        result.innerHTML=`<img src="${url}" style="max-width:100%;border-radius:12px;margin-top:10px" data-act="open-ai-lightbox" data-src="${url}">
          <div class="small muted" style="margin-top:6px">${t('prompt')}: ${esc(englishPrompt)}</div>
          <div class="row" style="margin-top:10px;gap:8px"><button class="btn ghost grow" data-act="ai-save-image" data-src="${url}">${t('download')}</button><button class="btn primary grow" data-act="ai-to-chat" data-src="${url}">${t('toChat')}</button></div>`;
      };
      img.onerror=()=>{result.innerHTML='<div class="small" style="color:#ef4444;text-align:center;padding:14px">Ошибка генерации</div>'};
      img.src=url;
    }catch(e){result.innerHTML=`<div class="small" style="color:#ef4444;text-align:center;padding:14px">Ошибка: ${esc(e.message)}</div>`}
  }

      <input id="g-name" placeholder="${t('groupName')}" value="${esc(state.groupName)}">
      <div class="lbl">${t('pickMembers')}</div>
      ${users.map(x=>`<label class="item" style="cursor:pointer">${avaHtml(x,'xs')}<div class="grow"><b>${esc(x.display_name||x.username)}</b></div><input type="checkbox" data-act="toggle-member" data-id="${x.id}" ${state.groupMembers.includes(x.id)?'checked':''} style="width:auto"></label>`).join('')||`<div class="empty">${t('noUsers')}</div>`}
      <button class="btn primary wide" data-act="create-group-btn">${t('create')}</button></div></div>`;
  }
  function renderMembers(){
    const c=state.chat;if(!c)return '';
    const members=state.members[c.id]||[];
    const amAdmin=isAdmin(c.id);const creator=isCreator(c.id);
    return `<div class="overlay"><div class="card modal"><div class="row between"><b>${t('members')} (${members.length})</b><button class="icon" data-act="close-modal">✕</button></div>
      ${members.map(m=>{const p=state.profiles[m.user_id];const isMe=m.user_id===state.user.id;return `<div class="member-row">${avaHtml(p,'sm')}<div class="grow"><b>${esc(p?.display_name||'?')}${isMe?' (вы)':''}</b><div class="row"><span class="badge ${m.role==='admin'?'admin':''}">${m.role}</span>${m.muted?'<span class="badge muted">🔇</span>':''}</div></div>${amAdmin&&!isMe?`<div class="member-actions">${m.role==='admin'?`<button class="btn small ghost" data-act="demote" data-id="${m.user_id}">−</button>`:`<button class="btn small ghost" data-act="promote" data-id="${m.user_id}">+</button>`}${m.muted?`<button class="btn small ghost" data-act="unmute" data-id="${m.user_id}">🔊</button>`:`<button class="btn small danger" data-act="mute" data-id="${m.user_id}">🔇</button>`}${!creator||m.user_id!==c.created_by?`<button class="btn small danger" data-act="kick" data-id="${m.user_id}">✕</button>`:''}</div>`:''}</div>`}).join('')}
      ${c.is_group?`<button class="btn danger wide" data-act="leave-group">${t('leaveGroup')}</button>`:''}</div></div>`;
  }
  function renderGroupSettings(){
    const cid=state.groupSettings;const c=state.chats.find(x=>x.id===cid);
    if(!c)return '';
    const amAdmin=isAdmin(cid);const creator=isCreator(cid);
    return `<div class="overlay"><div class="card modal"><div class="row between"><b>⚙️ ${t('settings')}</b><button class="icon" data-act="close-group-settings">✕</button></div>
      <div class="row" style="justify-content:center">${avaHtml({avatar_url:c.avatar_url,display_name:c.name,accent_color:'#f59e0b'},'big')}</div>
      ${amAdmin?`<button class="btn ghost" data-act="pick-group-avatar">${t('groupAvatar')}</button><input type="file" id="group-avatar-file" accept="image/*" style="display:none">`:''}
      <div class="lbl">${t('groupName')}</div>
      <input id="gs-name" value="${esc(c.name||'')}" ${amAdmin?'':'disabled'}>
      <div class="lbl">${t('groupDesc')}</div>
      <textarea id="gs-desc" rows="2" style="resize:none" ${amAdmin?'':'disabled'}>${esc(c.description||'')}</textarea>
      ${amAdmin?`<button class="btn primary wide" data-act="save-group-settings">${t('save')}</button>`:''}
      <button class="btn ghost wide" data-act="view-members">${t('members')} (${(state.members[cid]||[]).length})</button>
      <button class="btn danger wide" data-act="leave-group">${t('leaveGroup')}</button>
      ${creator?`<button class="btn danger wide" data-act="delete-group" data-id="${cid}">🗑️ ${t('deleteGroup')}</button>`:''}
    </div></div>`;
  }
  function renderProfileView(){
    const u=state.profiles[state.viewProfile];if(!u)return '';
    const myChats=state.chats.filter(c=>(state.members[c.id]||[]).some(m=>m.user_id===u.id));
    const isMe=u.id===state.user.id;
    return `<div class="overlay"><div class="card modal">
      <div class="row between"><b>${t('profile')}</b><button class="icon" data-act="close-profile-view">✕</button></div>
      <div class="row" style="align-items:flex-start">${avaHtml(u,'big')}<div class="grow"><h2 style="margin:0 0 4px">${esc(u.display_name||u.username)}</h2><div class="muted small">@${esc(u.username)}</div>
        <div class="muted small" style="margin-top:4px">${formatLastSeen(u)}</div>
        ${u.bio?`<div style="margin-top:8px">${esc(u.bio)}</div>`:`<div class="muted small" style="margin-top:8px">${t('bio')}</div>`}
      </div></div>
      <div class="lbl">${t('commonChats')} (${myChats.length})</div>
      <div class="list">${myChats.length?myChats.map(c=>{
        const members=state.members[c.id]||[];const other=members.find(m=>m.user_id!==state.user.id);
        const op=other?state.profiles[other.user_id]:null;
        const title=c.is_group?c.name:(op?.display_name||'Чат');
        const av=c.is_group?{display_name:c.name,accent_color:'#f59e0b'}:(op||{});
        return `<div class="item" data-act="profile-open-chat" data-id="${c.id}">${avaHtml(av,'xs')}<div class="grow"><b>${esc(title)}</b></div></div>`;
      }).join(''):`<div class="empty">${t('noCommon')}</div>`}</div>
      ${!isMe?`<button class="btn primary wide" data-act="dm-from-profile" data-id="${u.id}">${t('write')}</button>`:''}
    </div></div>`;
  }
  function renderStoryCompose(){
    let preview='';
    if(state.storyMedia)preview=`<div style="position:relative"><img class="preview-media" src="${state.storyMedia}"><button class="btn small danger" data-act="remove-story-media" style="position:absolute;top:6px;right:6px">✕</button></div>`;
    return `<div class="overlay"><div class="card modal"><div class="row between"><b>${t('newStory')}</b><button class="icon" data-act="close-modal">✕</button></div>
      ${preview}<textarea id="story-text" rows="3" placeholder="${t('caption')}" style="resize:none"></textarea>
      <button class="btn ghost" data-act="pick-story-media">${t('photo')}</button><input type="file" id="story-file" accept="image/*" style="display:none">
      <button class="btn primary" data-act="publish-story">${t('publish')}</button></div></div>`;
  }
  function renderStoryView(){
    const s=state.stories.find(x=>x.id===state.viewStory);if(!s)return '';
    const au=state.profiles[s.user_id];
    const media=s.media_url?`<img src="${s.media_url}" style="max-width:100%;max-height:60vh;object-fit:contain;border-radius:16px">`:'';
    const bg=s.media_url?'background:#0b0c10':`background:${s.background_color||'#6366f1'}`;
    return `<div class="story-full" style="${bg}" data-act="close-story"><div class="row">${avaHtml(au,'xs','background:rgba(0,0,0,.35);')}<b>${esc(au?.display_name||'')}</b><div class="grow"></div><div class="small">${time(s.created_at)}</div></div>
      <div style="display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;flex:1">${media}${s.content?`<div style="text-align:center">${esc(s.content)}</div>`:''}</div>
      <div style="text-align:center" class="small">tap</div></div>`;
  }
  function renderMsgMenu(){
    const m=state.messages.find(x=>x.id===state.msgMenu);if(!m)return '';
    const isMine=m.sender_id===state.user.id;
    return `<div class="overlay"><div class="card modal"><div class="row between"><b>${t('reaction')}</b><button class="icon" data-act="close-msg-menu">✕</button></div>
      <div class="chips" style="font-size:22px">${EMOJI_REACTS.map(e=>`<button class="chip" data-act="react-msg" data-id="${m.id}" data-v="${e}">${e}</button>`).join('')}</div>
      ${isMine&&m.content?`<button class="btn ghost" data-act="edit-msg" data-id="${m.id}">${t('edit')}</button>`:''}
      ${isMine?`<button class="btn danger" data-act="delete-msg" data-id="${m.id}">${t('del')}</button>`:''}</div></div>`;
  }
  function renderCall(){
    const other=state.profiles[state.call.outbound?state.call.callee_id:state.call.caller_id];
    return `<div class="overlay"><div class="call"><div class="video-wrap"><video id="remote-video" autoplay playsinline muted></video><video id="local-video" autoplay playsinline muted></video></div>
      <div class="row" style="justify-content:center">${avaHtml(other,'sm')}<b>${esc(other?.display_name||'?')}</b></div>
      <div class="muted" id="call-timer">${state.call.activeAt?'00:00':t('calling')}</div>
      <div id="call-status" class="muted small"></div><div id="call-diag" class="muted" style="font-size:10px;opacity:.6"></div>
      <div class="call-controls">
        <button class="call-btn ${state.muted?'off':''}" data-act="toggle-mute">${state.muted?'🔇':'🎤'}</button>
        <button class="call-btn ${state.cameraOn?'on':''}" data-act="toggle-cam">📹</button>
        <button class="call-btn ${state.screenOn?'on':''}" data-act="toggle-screen">🖥️</button>
        <button class="call-btn danger" data-act="end-call">📵</button>
      </div></div></div>`;
  }
  function renderIncoming(){
    const caller=state.profiles[state.incoming.caller_id];
    return `<div class="overlay"><div class="call">${avaHtml(caller,'huge')}<h2>${esc(caller?.display_name||'?')}</h2><div class="muted">${t('inCall')}</div>
      <div class="row" style="width:100%;gap:10px"><button class="btn success grow" data-act="accept-call">${t('acceptCall')}</button><button class="btn danger grow" data-act="decline-call">${t('declineCall')}</button></div></div></div>`;
  }

  /* ============ ДЕЙСТВИЯ ============ */
  async function doAuth(){
    const email=document.getElementById('a-email').value.trim();const pass=document.getElementById('a-pass').value;
    if(!email||!pass){state.authErr='...';render();return}
    try{
      if(state.authMode==='register'){
        const username=document.getElementById('a-user').value.trim();const name=document.getElementById('a-name').value.trim();
        if(!username){state.authErr='...';render();return}
        const {user}=await signUp(email,pass,username,name||username);
        if(user){state.user=user;await loadProfile();if(!state.profile){state.authErr='Подтвердите email';render();return}}
      }else{await signIn(email,pass);await loadSession()}
      await bootApp();
    }catch(e){state.authErr=e.message;render()}
  }
  async function bootApp(){
    await loadProfile();if(!state.profile){render();return}
    await loadChats();await loadStories();await loadAllUsers();
    subscribeIncomingCalls();subscribeProfiles();
    await selfCheckStorage();
    startHeartbeat();
    render();
  }
  async function sendMsg(){
    const inp=document.getElementById('msg-input');if(!inp)return;
    const txt=inp.value.trim();if(!txt||!state.chatId)return;
    const {error}=await sb.from('messages').insert({chat_id:state.chatId,sender_id:state.user.id,content:txt});
    if(error){showToast(error.message);return}
    inp.value='';playSend();
  }

  document.addEventListener('click',async e=>{
    const el=e.target.closest('[data-act]');if(!el)return;
    const a=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
    switch(a){
      case 'toggle-auth':state.authMode=state.authMode==='login'?'register':'login';state.authErr='';render();break;
      case 'do-auth':doAuth();break;
      case 'retry-profile':await loadProfile();if(state.profile)await bootApp();else render();break;
      case 'logout':signOut();break;
      case 'tab':state.tab=el.dataset.tab;state.chatId=null;state.chat=null;render();break;
      case 'open-chat':await openChat(id);break;
      case 'back':state.chatId=null;state.chat=null;if(msgChannel){sb.removeChannel(msgChannel);msgChannel=null}if(state.recording)stopRecording(false);render();break;
      case 'send':sendMsg();break;
      case 'new-chat':state.modal='pick';state.pickMode='chat';render();break;
      case 'new-group':state.createGroup=true;state.groupName='';state.groupMembers=[];render();break;
      case 'pick-user':if(state.pickMode==='call'){await startCall(id)}else{const cid=await startDM(id);if(cid)await openChat(cid)}break;
      case 'close-modal':state.modal=null;state.createGroup=false;state.viewMembers=false;state.storyCompose=false;state.storyMedia=null;render();break;
      case 'toggle-member':if(state.groupMembers.includes(id))state.groupMembers=state.groupMembers.filter(x=>x!==id);else state.groupMembers.push(id);break;
      case 'create-group-btn':{
        const name=document.getElementById('g-name').value.trim();
        if(!name||!state.groupMembers.length){showToast('...');return}
        el.disabled=true;
        const cid=await createGroup(name,state.groupMembers);
        el.disabled=false;
        if(cid){state.createGroup=false;await openChat(cid)}
        break;
      }
      case 'view-members':state.viewMembers=true;state.groupSettings=null;render();break;
      case 'promote':await setMemberRole(state.chatId,id,'admin');break;
      case 'demote':await setMemberRole(state.chatId,id,'member');break;
      case 'mute':await setMemberMuted(state.chatId,id,true);break;
      case 'unmute':await setMemberMuted(state.chatId,id,false);break;
      case 'kick':await kickMember(state.chatId||state.groupSettings,id);break;
      case 'leave-group':await leaveGroup(state.chatId||state.groupSettings);break;
      case 'open-group-settings':state.groupSettings=state.chatId;render();break;
      case 'close-group-settings':state.groupSettings=null;render();break;
      case 'pick-group-avatar':document.getElementById('group-avatar-file')?.click();break;
      case 'save-group-settings':{
        const cid=state.groupSettings;if(!cid)return;
        const name=document.getElementById('gs-name').value.trim();
        const desc=document.getElementById('gs-desc').value.trim();
        const {error}=await sb.from('chats').update({name,description:desc}).eq('id',cid);
        if(error){showToast(error.message);return}
        await refreshChatsAndMembers();state.groupSettings=null;render();break;
      }
      case 'delete-group':await deleteGroup(id);break;
      case 'msg-menu':state.msgMenu=id;render();break;
      case 'close-msg-menu':state.msgMenu=null;render();break;
      case 'react-msg':{
        const {data:existing}=await sb.from('reactions').select('*').eq('message_id',id).eq('user_id',state.user.id).eq('emoji',v).maybeSingle();
        if(existing){await sb.from('reactions').delete().eq('id',existing.id)}
        else{await sb.from('reactions').insert({message_id:id,user_id:state.user.id,emoji:v})}
        state.msgMenu=null;break;
      }
      case 'edit-msg':{const m=state.messages.find(x=>x.id===id);if(!m||!m.content)return;const nt=prompt('',m.content);if(!nt||!nt.trim())return;await sb.from('messages').update({content:nt.trim(),edited_at:new Date().toISOString()}).eq('id',id);state.msgMenu=null;break}
      case 'delete-msg':if(confirm(t('del')+'?'))await sb.from('messages').delete().eq('id',id);state.msgMenu=null;break;
      case 'add-story':state.storyCompose=true;state.storyMedia=null;render();break;
      case 'pick-story-media':document.getElementById('story-file')?.click();break;
      case 'remove-story-media':state.storyMedia=null;render();break;
      case 'publish-story':{
        const txt=document.getElementById('story-text').value.trim();
        if(!txt&&!state.storyMedia)return;
        let media_url=null;
        if(state.storyMedia){try{const blob=dataURLtoBlob(state.storyMedia);const path=`stories/${state.user.id}/${uid()}.jpg`;const {error:upErr}=await sb.storage.from('media').upload(path,blob,{contentType:'image/jpeg'});if(upErr){showToast(upErr.message);return}const {data:urlData}=sb.storage.from('media').getPublicUrl(path);media_url=urlData?.publicUrl}catch(err){showToast(err.message);return}}
        await sb.from('stories').insert({user_id:state.user.id,content:txt,media_url,background_color:state.storyBg});
        state.storyCompose=false;state.storyMedia=null;await loadStories();state.tab='stories';render();break;
      }
      case 'view-story':state.viewStory=id;render();break;
      case 'close-story':if(e.target.closest('img,button,audio,video'))return;state.viewStory=null;render();break;
      case 'pick-avatar':document.getElementById('avatar-file')?.click();break;
      case 'set-accent':await sb.from('profiles').update({accent_color:v}).eq('id',state.user.id);await loadProfile();render();break;
      case 'save-profile':{const name=document.getElementById('p-name').value.trim();const bio=document.getElementById('p-bio').value.trim();await sb.from('profiles').update({display_name:name,bio}).eq('id',state.user.id);await loadProfile();render();break}
      case 'toggle-theme':{const th=state.profile.theme==='light'?'dark':'light';await sb.from('profiles').update({theme:th}).eq('id',state.user.id);await loadProfile();render();break}
      case 'toggle-sounds':userSettings.sounds=!userSettings.sounds;saveSettings();render();break;
      case 'toggle-notif':userSettings.notifications=!userSettings.notifications;saveSettings();render();break;
      case 'font-plus':userSettings.fontScale=Math.min(1.4,(userSettings.fontScale||1)+0.1);saveSettings();render();break;
      case 'font-minus':userSettings.fontScale=Math.max(0.8,(userSettings.fontScale||1)-0.1);saveSettings();render();break;
      case 'set-lang':userSettings.lang=v;saveSettings();render();break;
      case 'clear-cache':if(!confirm(t('clearCacheConfirm')))return;try{for(const k of Object.keys(localStorage)){if(k.startsWith('nova_ai')||k==='nova_settings'||k==='nova-auth')continue;localStorage.removeItem(k)}}catch(e){}break;
      case 'call':await startCall(id);break;
      case 'accept-call':await acceptCall();break;
      case 'decline-call':await declineCall();break;
      case 'end-call':await endCall();break;
      case 'toggle-mute':toggleMute();break;
      case 'toggle-cam':await toggleCamera();break;
      case 'toggle-screen':await toggleScreen();break;
      case 'start-rec':await startRecording();break;
      case 'stop-rec':stopRecording(true);break;
      case 'cancel-rec':stopRecording(false);break;
      case 'attach-file':document.getElementById('chat-file')?.click();break;
      case 'open-lightbox':e.stopPropagation();state.lightbox=el.dataset.src;render();break;
      case 'close-lightbox':state.lightbox=null;render();break;
      case 'ai-send':await sendAIMessage();break;
      case 'ai-clear':if(confirm('?')){state.aiMessages=[];saveAIHistory();render()}break;
      case 'ai-image':state.aiModal='image';render();break;
      case 'close-ai-image':state.aiModal=null;render();break;
      case 'ai-image-go':await generateAIImage();break;
      case 'ai-save-image':{const url=el.dataset.src;const link=document.createElement('a');link.href=url;link.download='nova-ai.png';link.target='_blank';link.click();break}
      case 'ai-to-chat':{state.aiMessages.push({role:'assistant',content:'',image:el.dataset.src});saveAIHistory();state.aiModal=null;render();break}
      case 'ai-song':{const inp=document.getElementById('ai-input');if(inp){inp.value=userSettings.lang==='en'?'Write a song about ':'Напиши текст песни про ';inp.focus()}break}
      case 'view-profile':state.viewProfile=id;render();break;
      case 'close-profile-view':state.viewProfile=null;render();break;
      case 'profile-open-chat':state.viewProfile=null;await openChat(id);break;
      case 'dm-from-profile':{const cid=await startDM(id);state.viewProfile=null;if(cid)await openChat(cid);break}
      case 'open-ai-lightbox':state.lightbox=el.dataset.src;state.aiModal=null;render();break;
    }
  });

  document.addEventListener('change',async e=>{
    if(e.target.id==='avatar-file'){
      const f=e.target.files[0];if(!f)return;
      try{const data=await resizeImage(f,300,0.85);const blob=dataURLtoBlob(data);const path=`avatars/${state.user.id}.jpg`;const {error:upErr}=await sb.storage.from('media').upload(path,blob,{upsert:true,contentType:'image/jpeg'});if(upErr){showToast(upErr.message);return}const {data:urlData}=sb.storage.from('media').getPublicUrl(path);const {error:updErr}=await sb.from('profiles').update({avatar_url:urlData.publicUrl+'?t='+Date.now()}).eq('id',state.user.id);if(updErr){showToast(updErr.message);return}await loadProfile();render()}catch(err){showToast(err.message)}
      e.target.value='';
    }
    if(e.target.id==='group-avatar-file'){
      const f=e.target.files[0];if(!f||!state.groupSettings)return;
      try{const data=await resizeImage(f,300,0.85);const blob=dataURLtoBlob(data);const path=`groups/${state.groupSettings}.jpg`;const {error:upErr}=await sb.storage.from('media').upload(path,blob,{upsert:true,contentType:'image/jpeg'});if(upErr){showToast(upErr.message);return}const {data:urlData}=sb.storage.from('media').getPublicUrl(path);const {error:updErr}=await sb.from('chats').update({avatar_url:urlData.publicUrl+'?t='+Date.now()}).eq('id',state.groupSettings);if(updErr){showToast(updErr.message);return}await refreshChatsAndMembers();render()}catch(err){showToast(err.message)}
      e.target.value='';
    }
    if(e.target.id==='story-file'){const f=e.target.files[0];if(!f)return;try{state.storyMedia=await resizeImage(f,800,0.75);render()}catch(err){showToast(err.message)}e.target.value=''}
    if(e.target.id==='chat-file'){const f=e.target.files[0];if(!f)return;await sendChatFile(f);e.target.value=''}
    if(e.target.dataset.act==='set-privacy-ls'){await sb.from('profiles').update({privacy_last_seen:e.target.value}).eq('id',state.user.id);await loadProfile();render()}
    if(e.target.dataset.act==='set-privacy-msg'){await sb.from('profiles').update({privacy_messages:e.target.value}).eq('id',state.user.id);await loadProfile();render()}
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.id==='msg-input'){e.preventDefault();sendMsg()}
    if(e.key==='Enter'&&e.target.id==='ai-input'){e.preventDefault();sendAIMessage()}
  });
  window.addEventListener('beforeunload',()=>{if(state.recording){try{state.mediaRecorder?.stop()}catch(e){}cleanupRecordUI()}if(sigPollTimer)clearInterval(sigPollTimer);if(heartbeatTimer)clearInterval(heartbeatTimer)});
  sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT'){state.user=null;state.profile=null;render()}if(event==='TOKEN_REFRESHED'&&session?.user){state.user=session.user}});

  (async()=>{try{await loadSession();if(state.user){await loadProfile()}if(state.user&&state.profile)await bootApp();else render()}catch(e){console.error('BOOT ERROR:',e);fatal('Ошибка',String(e.message||e),'F12 → Console')}})();
})();
</script>
</body>
</html>
