<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>◈Nova</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#6366f1">
<meta name="color-scheme" content="light dark">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
:root{--accent:#6366f1;--accent-2:#8b5cf6;--accent-grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);--bg:#0a0b10;--bg-2:#0f1117;--card:#151822;--card-2:#1c2030;--text:#f0f2f8;--muted:#7c8599;--line:#252a3a;--fs:1;--online:#10b981;--danger:#ef4444;color-scheme:light dark}
body.light{--bg:#f6f7fb;--bg-2:#eef0f6;--card:#fff;--card-2:#f5f6fa;--text:#0f1117;--muted:#6b7280;--line:#e2e5ee}
html,body{height:100%}
body{background:var(--bg);color:var(--text);overflow:hidden;font-size:calc(14px*var(--fs));-webkit-tap-highlight-color:transparent;transition:background .3s ease,color .3s ease}
@keyframes aurora-drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(1.5%,-1%) scale(1.03)}}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,rgba(99,102,241,.22) 0%,transparent 50%),radial-gradient(circle at 85% 80%,rgba(139,92,246,.18) 0%,transparent 50%),radial-gradient(circle at 50% 100%,rgba(16,185,129,.08) 0%,transparent 60%);pointer-events:none;z-index:0;animation:aurora-drift 32s ease-in-out infinite;will-change:transform}
body.light::before{opacity:1;background:radial-gradient(circle at 12% 15%,rgba(255,182,193,.5) 0%,transparent 45%),radial-gradient(circle at 88% 20%,rgba(196,181,253,.5) 0%,transparent 50%),radial-gradient(circle at 25% 85%,rgba(167,243,208,.45) 0%,transparent 45%),radial-gradient(circle at 90% 88%,rgba(253,230,138,.4) 0%,transparent 50%),radial-gradient(circle at 55% 45%,rgba(191,219,254,.35) 0%,transparent 55%)}
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;outline:none;transition:border-color .3s ease,background .3s ease,box-shadow .3s ease}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 20%,transparent)}
.muted{color:var(--muted)}.small{font-size:12px}.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.btn{background:var(--card);border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-weight:500;transition:transform .25s cubic-bezier(.2,.9,.3,1.2),background .2s,box-shadow .2s,opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.93)}
.btn.primary{background:var(--accent-grad);border:0;color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(99,102,241,.35)}
.btn.success{background:var(--online);border-color:var(--online);color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn.small{padding:8px 14px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.icon{padding:10px;border-radius:12px;font-size:18px;display:grid;place-items:center;transition:background .2s,color .2s,transform .2s cubic-bezier(.2,.9,.3,1.2),opacity .2s}
.auth-wrap{flex:1;display:grid;place-items:center;padding:20px;overflow-y:auto}
.auth-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
body.light .auth-card{box-shadow:0 12px 40px rgba(0,0,0,.08)}
.logo{font-size:32px;font-weight:900;letter-spacing:-.5px;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:8px}
.err{color:var(--danger);font-size:13px;min-height:18px}
.top{display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(21,24,34,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);position:relative;z-index:10}
body.light .top{background:rgba(255,255,255,.82)}
.top-title{font-size:22px;font-weight:800;letter-spacing:-.5px;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;user-select:none;transition:transform .2s ease,filter .2s ease}
.top-title:active{transform:scale(.94)}
.top-title:hover{filter:brightness(1.15)}
.ava{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;background-size:cover;background-position:center;overflow:hidden;position:relative;transition:box-shadow .25s ease,transform .25s ease}
.ava.sm{width:36px;height:36px;font-size:17px;border-radius:12px}
.ava.big{width:88px;height:88px;font-size:42px;border-radius:28px;cursor:pointer}
.ava.big:hover{transform:scale(1.05)}
.ava.xs{width:28px;height:28px;font-size:14px;border-radius:10px}
.ava.huge{width:120px;height:120px;font-size:56px;border-radius:40px}
.ava.story-ring-unviewed{box-shadow:0 0 0 3px var(--accent);animation:pulse 2.4s ease-in-out infinite}
.ava.story-ring-viewed{box-shadow:0 0 0 3px #555}
.ava-online::after{content:'';position:absolute;bottom:0;right:0;width:12px;height:12px;background:var(--online);border:2.5px solid var(--card);border-radius:50%}
.content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.content.chat{padding:0;gap:0;overflow:hidden;display:flex;flex-direction:column}
.tabs{display:flex;border-top:1px solid var(--line);background:rgba(21,24,34,.9);backdrop-filter:blur(20px);padding:6px 4px calc(6px + env(safe-area-inset-bottom)) 4px}
body.light .tabs{background:rgba(255,255,255,.88)}
.tab{flex:1;padding:8px 2px;font-size:10px;color:var(--muted);position:relative;transition:color .3s ease,transform .3s ease;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab-icon{font-size:22px;transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.tab.on{color:var(--accent);font-weight:600}
.tab.on .tab-icon{transform:scale(1.15)}
.tab-badge{position:absolute;top:2px;right:calc(50% - 24px);background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;position:relative;transition:background .15s,transform .15s,box-shadow .15s}
.item:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
body.light .item:hover{box-shadow:0 8px 20px rgba(0,0,0,.08)}
.item:active{transform:scale(.99);background:var(--card-2)}
.item.unread{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.item-badge{background:var(--accent-grad);color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;font-weight:700;min-width:22px;text-align:center;animation:bounceIn .6s ease both,pulse 2.4s ease-in-out 1s infinite}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:rgba(21,24,34,.95);backdrop-filter:blur(20px);flex:none}
body.light .chat-head{background:rgba(255,255,255,.92)}
.banner{margin:12px;padding:14px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 15%,var(--card)),var(--card));display:flex;flex-direction:column;gap:10px}
body.light .banner{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--card)),var(--card))}
.pinned-bar{padding:10px 14px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 15%,var(--card)),var(--card));border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
body.light .pinned-bar{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 12%,var(--card)),var(--card))}
.reply-preview{padding:10px 14px;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:13px;flex:none}
.messages-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;touch-action:pan-y;scroll-behavior:smooth}
.scroll-down-btn{position:absolute;bottom:16px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--accent-grad);color:#fff;font-size:18px;display:none;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(99,102,241,.5);z-index:5;cursor:pointer}
.scroll-down-btn.show{display:flex}
.scroll-down-btn .badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:700;min-width:18px;text-align:center}
.msg-row{display:flex;gap:6px;align-items:flex-end;max-width:88%}
.msg-row.in{align-self:flex-start}
.msg-row.out{align-self:flex-end;flex-direction:row-reverse}
.msg-row.new{animation:msgIn .45s cubic-bezier(.2,.9,.3,1.2) both}
.msg-row.new .bubble{animation:bubblePop .45s cubic-bezier(.2,.9,.3,1.2) both}
.msg-menu-btn{font-size:16px;color:var(--muted);opacity:0;padding:4px}
.msg-row:hover .msg-menu-btn{opacity:1}
.msg{display:flex;flex-direction:column;min-width:0;max-width:100%}
.msg.out{align-items:flex-end}.msg.in{align-items:flex-start}
.bubble{padding:11px 15px;border-radius:20px;background:var(--card);border:1px solid var(--line);word-break:break-word;max-width:100%}
body.light .bubble{box-shadow:0 1px 3px rgba(0,0,0,.04)}
.msg.out .bubble{background:var(--accent-grad);border:0;color:#fff;border-bottom-right-radius:6px;box-shadow:none}
.msg.in .bubble{border-bottom-left-radius:6px}
.bubble a{text-decoration:underline;opacity:.95}
.bubble img.msg-image{max-width:260px;max-height:260px;border-radius:14px;display:block;margin-bottom:6px;object-fit:cover;cursor:pointer}
.bubble audio{max-width:260px;display:block;margin-bottom:4px}
.bubble video{max-width:280px;max-height:240px;border-radius:14px;display:block;margin-bottom:6px;background:#000}
.file-link{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:rgba(0,0,0,.2);text-decoration:none;color:inherit;margin-bottom:6px;max-width:280px}
.file-icon{font-size:22px;flex:none}
.file-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px}
.file-size{display:block;font-size:11px;opacity:.7}
.reply-quote{border-left:3px solid var(--accent);padding:5px 9px;margin-bottom:6px;background:rgba(0,0,0,.15);border-radius:8px;font-size:12px;cursor:pointer;max-width:100%}
body.light .reply-quote{background:rgba(0,0,0,.04)}
.msg.out .reply-quote{background:rgba(255,255,255,.18);border-left-color:#fff}
.reply-name{font-weight:600;color:var(--accent);margin-bottom:2px}
.msg.out .reply-name{color:#fff}
.reply-text{opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sender-name{font-size:11px;color:var(--accent);margin-bottom:2px;font-weight:600}
.edited-mark{opacity:.7;font-size:11px;margin-left:4px}
.ts{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:3px}
.ts .check{font-size:12px}
.ts .check.read{color:var(--accent)}
.msg.out .ts{color:rgba(255,255,255,.75)}
.msg.out .ts .check.read{color:#fff}
.reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.reaction-chip{padding:3px 9px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);font-size:12px;cursor:pointer;transition:transform .15s,background .15s,border-color .15s;animation:bounceIn .4s ease both}
.reaction-chip:hover{transform:scale(1.12)}
.reaction-chip.mine{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent)}
.composer{display:flex;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;border-top:1px solid var(--line);background:rgba(21,24,34,.95);backdrop-filter:blur(20px);align-items:center;flex:none}
body.light .composer{background:rgba(255,255,255,.92)}
.composer .icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--card);border:1px solid var(--line);flex:none;transition:background .2s,color .2s,transform .2s cubic-bezier(.2,.9,.3,1.2),opacity .2s}
.composer .icon-btn:active{transform:scale(.88)}
.rec-bar{display:flex;align-items:center;gap:10px;flex:1;background:var(--danger);color:#fff;padding:12px 16px;border-radius:16px;font-weight:600}
.typing-indicator{display:none;padding:8px 16px;gap:4px;align-items:center;background:var(--card);border-top:1px solid var(--line)}
.typing-indicator.on{display:flex;animation:fadeIn .3s ease both}
.typing-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:tb 1.4s infinite ease-in-out;display:inline-block}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;z-index:50;animation:fadeIn .45s ease both}
body.light .overlay{background:rgba(15,17,23,.5)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;animation:popIn .55s cubic-bezier(.2,.9,.3,1.2) both}
body.light .card{box-shadow:0 8px 32px rgba(0,0,0,.08)}
.modal{width:100%;max-width:480px;max-height:85vh;overflow:auto;position:relative;scroll-behavior:smooth;animation:popIn .55s cubic-bezier(.2,.9,.3,1.2) both}
.overlay.closing{animation:fadeOut .35s ease both;pointer-events:none}
.overlay.closing .card,.overlay.closing .modal,.overlay.closing .call{animation:popOut .35s ease both}
.call{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;min-width:280px;max-width:520px}
.call-controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.call-btn{width:56px;height:56px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:22px;display:grid;place-items:center}
.call-btn.on{background:var(--accent-grad);border:0;color:#fff}
.call-btn.off{background:var(--danger);border-color:var(--danger);color:#fff}
.call-btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
#remote-video{width:100%;max-height:45vh;border-radius:20px;background:#000;object-fit:contain;min-height:180px}
#local-video{position:absolute;bottom:10px;right:10px;width:110px;height:80px;border-radius:12px;object-fit:cover;background:#000;border:2px solid var(--accent);display:none}
.video-wrap{position:relative;width:100%}
.call-reaction{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);font-size:40px;animation:cf 2s ease-out forwards;pointer-events:none}
@keyframes cf{0%{opacity:0;transform:translate(-50%,20px)}30%{opacity:1;transform:translate(-50%,-10px)}100%{opacity:0;transform:translate(-50%,-60px)}}
.call-mini{position:fixed;top:78px;right:12px;width:38vw;max-width:200px;min-width:140px;background:var(--card);border:2px solid var(--accent);border-radius:18px;padding:6px;z-index:45;box-shadow:0 12px 40px rgba(0,0,0,.6);cursor:pointer}
.call-mini .name{font-size:12px;font-weight:600;margin-bottom:4px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call-mini video{width:100%;height:90px;border-radius:12px;background:#000;object-fit:cover;display:block}
.call-mini .timer{font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
.call-mini-controls{display:flex;gap:4px;margin-top:6px;justify-content:center}
.call-mini-controls button{width:32px;height:32px;border-radius:50%;background:var(--bg-2);font-size:14px;display:grid;place-items:center;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 12px;border-radius:14px;border:1px solid var(--line);font-size:18px}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent)}
.dot{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.dot.on{border-color:var(--text);box-shadow:0 0 12px currentColor}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:8px;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px}
.story-full{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;color:#fff;font-size:16px;font-weight:600;background:#000;animation:fadeIn .4s ease both}
.story-full>div{animation:popIn .55s cubic-bezier(.2,.9,.3,1.2) both}
.preview-media{width:100%;max-height:200px;object-fit:cover;border-radius:14px;display:block;animation:slideUpIn .4s ease both}
.badge{font-size:10px;padding:3px 8px;border-radius:8px;background:var(--line);color:var(--text);font-weight:600}
.badge.admin{background:#f59e0b;color:#000}
.badge.muted{background:var(--danger);color:#fff}
.member-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--bg-2)}
.member-actions{display:flex;gap:6px;flex-wrap:wrap}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;overflow:hidden;animation:fadeIn .4s ease both}
.lightbox img{max-width:88vw;max-height:88vh;width:auto;height:auto;object-fit:contain;border-radius:14px;animation:popIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.boot{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;background:var(--bg);transition:background .3s ease}
.boot .ring{width:56px;height:56px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
.boot .msg{font-size:15px;font-weight:600}
.boot .hint{font-size:12px;color:var(--muted);max-width:340px;line-height:1.5}
.boot .fatal-title{color:var(--danger);font-size:18px;font-weight:700;margin-bottom:8px}
.boot .fatal-text{font-size:14px;line-height:1.6;max-width:480px}
.boot .fatal-hint{font-size:13px;color:var(--muted);line-height:1.6;max-width:480px;margin-top:14px}
.ai-chat{display:flex;flex-direction:column;height:60vh;background:var(--bg-2);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ai-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.ai-msg{max-width:88%;padding:11px 15px;border-radius:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.ai-msg.user{align-self:flex-end;background:var(--accent-grad);color:#fff}
.ai-msg.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.ai-msg img{max-width:100%;border-radius:12px;margin-bottom:6px;display:block}
.ai-composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:center}
.floating-ai{position:fixed;right:18px;bottom:88px;width:56px;height:56px;border-radius:50%;background:var(--accent-grad);color:#fff;font-size:26px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(99,102,241,.5);z-index:40}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:50vh;overflow-y:auto;scroll-behavior:smooth}
.call-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:transform .15s,box-shadow .15s}
.call-item:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.call-item.missed{background:linear-gradient(135deg,rgba(239,68,68,.1),var(--card));border-color:rgba(239,68,68,.3)}
.call-icon{font-size:20px;color:var(--accent)}
.call-icon.missed{color:var(--danger)}
.settings-section{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}
.settings-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;letter-spacing:-.3px;margin-bottom:4px}
.settings-icon{font-size:22px;display:inline-grid;place-items:center;width:38px;height:38px;background:color-mix(in srgb,var(--accent) 15%,var(--card));border-radius:12px}
.memory-box{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.memory-val{font-size:20px;font-weight:700;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.profile-hero{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;flex-shrink:0}
.profile-hero-name{font-size:22px;font-weight:800;letter-spacing:-.5px}
.profile-hero-username{color:var(--muted);font-size:14px;margin-top:2px}
.profile-hero-bio{color:var(--muted);font-size:13px;margin-top:6px;max-width:280px;line-height:1.5}
.avatar-wrap{position:relative;flex-shrink:0;cursor:pointer}
.avatar-badge{position:absolute;bottom:0;right:0;background:var(--accent-grad);color:#fff;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px;border:3px solid var(--card);pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.stories-grid-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;padding:8px 0;max-height:60vh;overflow-y:auto;scroll-behavior:smooth}
.story-thumb{display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.9,.3,1.2);animation:slideUpIn .4s ease both;animation-delay:var(--d,0s)}
.story-thumb:hover{transform:scale(1.03)}
.story-thumb-media{aspect-ratio:9/14;border-radius:12px;overflow:hidden;background:var(--bg-2);position:relative;border:2px solid transparent;transition:border-color .3s ease,transform .3s ease,box-shadow .3s ease}
.story-thumb.story-thumb-unviewed .story-thumb-media{border-color:var(--accent)}
.story-thumb.story-thumb-viewed .story-thumb-media{border-color:#444}
.story-thumb:hover .story-thumb-media{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 24px rgba(0,0,0,.4)}
.story-thumb-author{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);overflow:hidden}
.story-thumb-author span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

function rImg(file,md,q){return new Promise((res,rej)=>{if(!file||!file.type?.startsWith('image/'))return rej(new Error('Не изображение'));const i=new Image();const u=URL.createObjectURL(file);i.onload=()=>{URL.revokeObjectURL(u);const w=i.naturalWidth||i.width,h=i.naturalHeight||i.height;if(!w||!h)return rej(new Error('0×0'));let W=w,H=h;if(W>md||H>md){const r=Math.min(md/W,md/H);W=Math.round(W*r);H=Math.round(H*r)}const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(i,0,0,W,H);let d;try{d=c.toDataURL('image/jpeg',q)}catch(e){return rej(e)}if(!d?.startsWith('data:image'))return rej(new Error('пусто'));res(d)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('load'))};i.src=u})}

async function tryLogin(input, password){
  const raw=String(input||'').trim();const low=raw.toLowerCase();
  if(!low||!password)return {data:null,error:new Error('Пустой логин или пароль')};
  const attempts=[];
  const ph=nPhone(low);
  if(ph){attempts.push(ph.replace(/\D/g,'')+'@nova.local');attempts.push(low)}
  if(low.includes('@'))attempts.push(low);
  if(/^[a-zA-Z0-9_]{3,20}$/.test(low)){attempts.push(low+'@nova.app');attempts.push(low+'@nova.local')}
  attempts.push(low);
  const unique=[...new Set(attempts)];
  let lastErr=null;
  for(const email of unique){try{const {data,error}=await sb.auth.signInWithPassword({email,password});if(!error&&data?.session)return {data,error:null};if(error)lastErr=error}catch(e){lastErr=e}}
  return {data:null,error:lastErr};
}

function setupWebRTC(){
if(!state.call||pc||!state.stream)return;
pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
state.stream.getTracks().forEach(t=>pc.addTrack(t,state.stream));
if(cameraTrack||screenTrack){const tr=cameraTrack||screenTrack;try{videoSender=pc.addTrack(tr,state.stream)}catch(e){}}
makingOffer=false;ignoreOffer=false;
pc.onnegotiationneeded=async()=>{try{makingOffer=true;await pc.setLocalDescription();await sendSig('offer',{sdp:pc.localDescription.toJSON()})}catch(e){console.warn('[WebRTC] negotiation failed',e);try{await pc.setLocalDescription({type:'rollback'})}catch(e2){}}finally{makingOffer=false}};
pc.ontrack=e=>{
if(e.track.kind==='audio'){let a=document.getElementById('remote-audio');if(!a){a=document.createElement('audio');a.id='remote-audio';a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}a.srcObject=e.streams[0]||new MediaStream([e.track]);a.play().catch(()=>{})}else if(e.track.kind==='video'){remoteStream=e.streams[0]||new MediaStream([e.track]);e.track.onunmute=()=>attachRemote();attachRemote()}
};
pc.onicecandidate=e=>{if(e.candidate)sendSig('ice',{candidate:e.candidate.toJSON()})};
pc.onconnectionstatechange=()=>{const el=document.getElementById('call-status');if(el)el.textContent=pc.connectionState==='connected'?t('connected'):pc.connectionState};
subSigs(state.call.id);startSigPoll(state.call.id);
if(callReactChannel){sb.removeChannel(callReactChannel);callReactChannel=null}
callReactChannel=sb.channel('call_react_'+state.call.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'call_reactions',filter:`call_id=eq.${state.call.id}`},(p)=>{if(p.new.user_id===state.user.id)return;state.callReactions.push(p.new);render();setTimeout(()=>{state.callReactions=state.callReactions.filter(r=>r.id!==p.new.id);render()},2000)}).subscribe();
(async()=>{if(pendingSignals.length){const ps=[...pendingSignals];pendingSignals=[];for(const s of ps){await procSig(s)}}})();
}
function subSigs(cid){if(sigChannel)sb.removeChannel(sigChannel);sigChannel=sb.channel('sig_'+cid).on('postgres_changes',{event:'INSERT',schema:'public',table:'call_signals',filter:`call_id=eq.${cid}`},async p=>{if(p.new.sender_id===state.user.id)return;if(processed.has(p.new.id))return;const ok=await procSig(p.new);if(ok)processed.add(p.new.id)}).subscribe()}
function startSigPoll(cid){if(sigPollTimer)clearInterval(sigPollTimer);sigPollTimer=setInterval(async()=>{if(!state.call||state.call.id!==cid)return;try{const {data}=await sb.from('call_signals').select('*').eq('call_id',cid).order('created_at');for(const s of data||[]){if(processed.has(s.id))continue;if(s.sender_id===state.user.id)continue;const ok=await procSig(s);if(ok)processed.add(s.id)}}catch(e){}},900)}
async function sendSig(type,payload){if(!state.call)return;await sb.from('call_signals').insert({call_id:state.call.id,sender_id:state.user.id,type,payload})}
async function procSig(s){
if(!pc){pendingSignals.push(s);return false}
try{
if(s.type==='offer'){
const polite=!state.call?.outbound;
const offerCollision=makingOffer||pc.signalingState!=='stable';
ignoreOffer=!polite&&offerCollision;
if(ignoreOffer){console.log('[WebRTC] ignore colliding offer (impolite)');return true}
if(offerCollision&&polite){console.log('[WebRTC] rollback (polite)');try{await pc.setLocalDescription({type:'rollback'})}catch(e){console.warn('[WebRTC] rollback failed',e);return false}}
await pc.setRemoteDescription(new RTCSessionDescription(s.payload.sdp));
await pc.setLocalDescription();
await sendSig('answer',{sdp:pc.localDescription.toJSON()});
return true;
}else if(s.type==='answer'){if(pc.signalingState==='have-local-offer'){await pc.setRemoteDescription(new RTCSessionDescription(s.payload.sdp))}return true}
else if(s.type==='ice'){try{await pc.addIceCandidate(new RTCIceCandidate(s.payload.candidate))}catch(e){if(!ignoreOffer)console.warn('ice',e)}return true}
return true;
}catch(e){console.warn('[WebRTC] sig error',e);return false}
}

function isReadByOthers(m){
if(!m||m.sender_id!==state.user.id)return false;
const c=state.chat;if(!c)return false;
const members=state.members[c.id]||[];
const others=members.filter(x=>x.user_id!==state.user.id);
if(!others.length)return false;
return others.every(o=>{const lr=state.chatReads?.[o.user_id];if(!lr)return false;return new Date(lr)>=new Date(m.created_at)});
}
function msgTs(m){

const check=read?'<span class="check read">✓✓</span>':'<span class="check">✓</span>';
return `<div class="ts">${ts} ${check}</div>`;
}
async function startRec(){if(state.recording||!state.chatId)return;if(!navigator.mediaDevices||!window.MediaRecorder){toast('Не поддерживается');return}try{const st=await navigator.mediaDevices.getUserMedia({audio:true});state.recordStream=st;const mc=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4','audio/ogg'];let mime='';for(const m of mc){if(window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)){mime=m;break}}const r=new MediaRecorder(st,mime?{mimeType:mime}:undefined);state.mediaRecorder=r;state.recordedChunks=[];r.ondataavailable=e=>{if(e.data&&e.data.size>0)state.recordedChunks.push(e.data)};r.onstop=async()=>{const b=new Blob(state.recordedChunks,{type:r.mimeType||'audio/webm'});state.recordedChunks=[];cleanRec();if(b.size<512)return;if(b.size>MAX){toast('Большая');return}await upAudio(b)};r.start();state.recording=true;state.recordStart=Date.now();pRecStart();render();state.recordInterval=setInterval(()=>{const el=document.getElementById('rec-time');if(el)el.textContent=fmtD((Date.now()-state.recordStart)/1000)},250)}catch(e){toast('Микрофон: '+e.message);cleanRec();render()}}
function stopRec(send=true){if(!state.recording||!state.mediaRecorder)return;try{if(state.mediaRecorder.state!=='inactive'){if(!send)state.recordedChunks=[];state.mediaRecorder.stop()}}catch(e){}state.recording=false;if(!send)cleanRec();pRecStop();render()}
function cleanRec(){if(state.recordInterval){clearInterval(state.recordInterval);state.recordInterval=null}state.recordStream?.getTracks().forEach(x=>x.stop());state.recordStream=null;state.mediaRecorder=null;state.recording=false}
async function upAudio(b){try{const ext=b.type.includes('mp4')?'m4a':b.type.includes('ogg')?'ogg':'webm';const p=`chat/${state.chatId}/${uid()}.${ext}`;const u=await upMedia(p,b,(b.type||'audio/webm').split(';')[0]);await sb.from('messages').insert({chat_id:state.chatId,sender_id:state.user.id,content:null,media_url:u,media_type:'audio',media_name:`${t('voice')}.${ext}`,media_size:b.size});pSend()}catch(e){toast('Аудио: '+(e.message||e))}}
async function sendFile(f){if(!f||!state.chatId)return;if(f.size>MAX){toast('Файл больше '+fSize(MAX));return}try{const mime=f.type||'application/octet-stream';let b=f,p,mt,name=f.name||'file';if(mime.startsWith('image/')){mt='image';try{const d=await rImg(f,1600,0.82);b=d2b(d);p=`chat/${state.chatId}/${uid()}.jpg`}catch(e){const ext=(name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');p=`chat/${state.chatId}/${uid()}.${ext||'jpg'}`}}else{const ext=(name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');p=`chat/${state.chatId}/${uid()}.${ext||'bin'}`;if(mime.startsWith('audio/'))mt='audio';else if(mime.startsWith('video/'))mt='video';else mt='file'}const u=await upMedia(p,b,mime);await sb.from('messages').insert({chat_id:state.chatId,sender_id:state.user.id,content:null,media_url:u,media_type:mt,media_name:name,media_size:f.size});pSend()}catch(e){toast('Файл: '+(e.message||e))}}

async function sendAI(){
const i=document.getElementById('ai-input');if(!i)return;const x=i.value.trim();
if(!x||state.aiLoading)return;
i.value='';state.aiMessages.push({role:'user',content:x});state.aiLoading=true;saveAI();render();
const sys=S.lang==='en'?'You are a helpful AI assistant.':'Ты полезный AI-ассистент. Отвечай кратко.';
const msgs=[{role:'system',content:sys},...state.aiMessages.slice(-20).map(m=>({role:m.role,content:m.content||''}))];
let attempts=0,lastErr=null;
while(attempts<3){
try{const r=await fetch('https://text.pollinations.ai/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,model:'openai',referrer:'nova-messenger'})});if(r.status===402){attempts++;lastErr='AI перегружен, попробуйте через минуту';if(attempts<3){await new Promise(res=>setTimeout(res,3000*attempts));continue}break}if(!r.ok)throw new Error('HTTP '+r.status);const a=(await r.text()).trim();state.aiMessages.push({role:'assistant',content:a||'...'});lastErr=null;break}catch(e){lastErr=e.message;attempts++;if(attempts<3)await new Promise(res=>setTimeout(res,2000*attempts))}
}
if(lastErr)state.aiMessages.push({role:'assistant',content:'⚠ '+lastErr});
state.aiLoading=false;saveAI();render();
setTimeout(()=>{const m=document.getElementById('ai-messages');if(m)m.scrollTop=m.scrollHeight},50);
}
async function genImg(){const i=document.getElementById('ai-image-prompt');if(!i)return;const pr=i.value.trim();if(!pr)return;const r=document.getElementById('ai-image-result');r.innerHTML=`<div class="muted small" style="text-align:center;padding:20px">⏳ ${t('improving')}</div>`;try{const tr=await fetch('https://text.pollinations.ai/'+encodeURIComponent(`Translate to English and enrich. Return ONLY prompt: "${pr}"`));let en=(await tr.text()).trim().replace(/^["'`]|["'`]$/g,'').split('\n')[0].slice(0,220);if(!en||en.length<5)en=pr;r.innerHTML=`<div class="muted small" style="text-align:center;padding:20px">🎨 ${t('generating')}</div>`;const sd=Math.floor(Math.random()*1000000);const u=`https://image.pollinations.ai/prompt/${encodeURIComponent(en)}?width=1024&height=1024&nologo=true&seed=${sd}&model=flux&referrer=nova-messenger`;const im=new Image();im.onload=()=>{r.innerHTML=`<img src="${u}" style="max-width:100%;border-radius:12px;margin-top:10px" data-act="open-ai-lb" data-src="${u}"><div class="row" style="margin-top:10px;gap:8px"><button class="btn ghost grow" data-act="ai-dl" data-src="${u}">${t('download')}</button><button class="btn primary grow" data-act="ai-to" data-src="${u}">${t('toChat')}</button></div>`};im.onerror=()=>{r.innerHTML='<div class="small" style="color:#ef4444;text-align:center;padding:14px">Ошибка</div>'};im.src=u}catch(e){r.innerHTML=`<div class="small" style="color:#ef4444;padding:14px">${esc(e.message)}</div>`}}

function renderTab(){if(state.tab==='calls')return renderCallsTab();if(state.tab==='contacts')return renderContactsTab();if(state.tab==='profile')return renderProfile();return renderChats()}
function renderChats(){
const seen=new Set();
const list=state.chats.filter(c=>{if(!c||seen.has(c.id))return false;seen.add(c.id);return true});
let h=`<div class="row between" style="margin-bottom:4px"><h2 style="font-size:20px;font-weight:800;letter-spacing:-.4px">${t('chats')}</h2><div class="row"><button class="btn small ghost" data-act="new-group">👥 ${t('newGroup').replace('👥 ','')}</button><button class="btn small primary" data-act="new-chat">${t('newChat')}</button></div></div>`;
if(!list.length)h+=`<div class="empty">${t('noChats')}<br><br><button class="btn primary" data-act="new-chat">${t('newChat')}</button></div>`;
h+='<div class="list">';
for(const c of list){
const m=state.members[c.id]||[];
const o=m.find(x=>x.user_id!==state.user.id);
if(o&&isBlocked(o.user_id))continue;
const op=o?state.profiles[o.user_id]:null;
const ti=c.is_group?c.name:(op?.display_name||'Чат');
const av=c.is_group?{avatar_url:c.avatar_url||null,accent_color:'#f59e0b',display_name:c.name}:(op||{});
const ls=!c.is_group&&op?fLastSeen(op):'';
const unread=state.unreadCounts[c.id]||0;
const ringClass=op?storyRing(op.id):'';
const avaHtml=ringClass?`<span data-act="open-user-stories" data-id="${op.id}" style="cursor:pointer;display:inline-flex">${aHtml(av,ringClass)}</span>`:aHtml(av);
h+=`<div class="item ${unread>0?'unread':''}" data-act="open-chat" data-id="${c.id}">${avaHtml}<div class="grow"><b style="font-size:15px">${esc(ti)}</b><div class="muted small" style="margin-top:2px">${c.is_group?`${m.length} ${t('members').toLowerCase()}`:(ls||'@'+esc(op?.username||'—'))}</div></div>${unread>0?`<span class="item-badge">${unread>99?'99+':unread}</span>`:''}</div>`;
}
return h+'</div>';
}

function renderMsgBody(m){
let o='';
let textContent = m.content || '';
const storyMatch = textContent.match(/^\[\[story:([a-f0-9-]+):([a-f0-9-]+)\]\]/i);
if(storyMatch){
const sid=storyMatch[1], ownerId=storyMatch[2];
textContent = textContent.slice(storyMatch[0].length);
const st = state.stories.find(x=>x.id===sid);
const owner = state.profiles[ownerId];
const isVid = st && /\.(mp4|webm|mov|ogv)(\?|$)/i.test(st.media_url||'');
const preview = st && st.media_url
? (isVid
? `<video src="${st.media_url}" muted playsinline style="width:40px;height:52px;object-fit:cover;border-radius:6px;flex:none;background:#000"></video>`
: `<img src="${st.media_url}" style="width:40px;height:52px;object-fit:cover;border-radius:6px;flex:none">`)
: `<div style="width:40px;height:52px;background:${st?.background_color||'var(--accent)'};border-radius:6px;flex:none"></div>`;
o+=`<div class="reply-quote" style="display:flex;gap:8px;align-items:center;cursor:pointer" data-act="open-story-from-msg" data-id="${ownerId}" data-sid="${sid}">${preview}<div style="min-width:0;flex:1"><div class="reply-name">✨ ${t('story')}${owner?' · '+esc(owner.display_name||owner.username):''}</div><div class="reply-text">${st?esc((st.content||'').slice(0,60)):t('storyUnavailable')}</div></div></div>`;
}
if(m.reply_to_id){
const parent=state.messages.find(x=>x.id===m.reply_to_id);
if(parent){const psnd=state.profiles[parent.sender_id];o+=`<div class="reply-quote" data-act="scroll-to" data-id="${parent.id}"><div class="reply-name">${esc(psnd?.display_name||'?')}</div><div class="reply-text">${esc((parent.content||'📎').slice(0,80))}</div></div>`}
}
const u=m.media_url||'';
const n=m.media_name||'file';
const s=m.media_size?fSize(m.media_size):'';
if(u&&m.media_type==='image')o+=`<img class="msg-image" src="${u}" data-act="open-lb" data-src="${u}">`;
else if(u&&m.media_type==='audio')o+=`<audio controls preload="metadata" src="${u}"></audio>`;
else if(u&&m.media_type==='video')o+=`<video controls preload="metadata" src="${u}"></video>`;
else if(u&&m.media_type==='file')o+=`<a class="file-link" href="${u}" target="_blank" download="${esc(n)}"><span class="file-icon">📎</span><span class="file-info"><span class="file-name">${esc(n)}</span><span class="file-size">${s}</span></span></a>`;
if(textContent)o+=`<div>${linkify(textContent)}${m.edited_at?'<span class="edited-mark">(изм.)</span>':''}</div>`;
else if(m.edited_at)o+=`<span class="edited-mark">(изм.)</span>`;
return o;
}

function renderStoriesPage(){

h+=`<div class="stories-grid-thumbs">`;

async function doAuth(){
const pwEl=document.getElementById('a-pass');
const errEl=document.querySelector('.err');
if(!pwEl)return;
const pw=pwEl.value;
const showErr=m=>{if(errEl)errEl.textContent=m;state.authErr=m};
if(!pw){showErr('Введите пароль');return}
try{
if(state.authMode==='register'){
const unEl=document.getElementById('a-user');
const nmEl=document.getElementById('a-name');
const un=unEl?.value.trim();
const nm=nmEl?.value.trim();
if(!un){showErr('Введите логин');return}
if(!/^[a-zA-Z0-9_]{3,20}$/.test(un)){showErr('Логин: 3–20 символов (a-z, 0-9, _)');return}
if(pw.length<6){showErr('Пароль: минимум 6 символов');return}
const fakeEmail=un.toLowerCase()+'@nova.app';
const {user,session}=await signUp(fakeEmail,pw,un.toLowerCase(),nm||un);
if(!session){showErr('Отключите Confirm email в Supabase');return}
state.user=session.user||user;
await loadProf();
if(!state.profile){showErr('Профиль не создан');return}
}else{
const lrEl=document.getElementById('a-login');
if(!lrEl)return;
const lr=lrEl.value.trim();
if(!lr){showErr('Введите логин, email или телефон');return}
const {data,error}=await tryLogin(lr,pw);
if(error||!data?.session){showErr('Неверный логин или пароль');return}
state.user=data.session.user;
await loadProf();
if(!state.profile){showErr('Профиль не найден');return}
}
state.authErr='';
await boot();
}catch(e){
const msg=e.message||String(e);
if(/already|duplicate|unique|registered/i.test(msg)){showErr('Этот логин уже занят')}else{showErr(msg)}
}
}
async function boot(){
await loadProf();if(!state.profile){render();return}

await loadChats();await loadStories();await loadAll();await loadContacts();await loadBlocks();
await loadUnread();await loadMissedCalls();await loadAllCalls();
await checkMissedCalls();
subCalls();subProfiles();subGlobalMessages();startHeartbeat();
await recoverActiveCalls();
if('Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}
if(refreshInterval)clearInterval(refreshInterval);
refreshInterval=setInterval(async()=>{if(!document.hidden){await loadUnread();render()}},15000);
render();
}

document.addEventListener('click',async e=>{

case 'allow-notif':{if('Notification' in window){try{const p=await Notification.requestPermission();if(p==='granted'){toast('Включены','#10b981');notify('Nova','Уведомления работают','test',true)}else toast('Заблокированы','#ef4444')}catch(e){toast(e.message)}}render();break}
case 'callback':await startCall(id);break;
case 'tab':state.tab=el.dataset.tab;state.chatId=null;state.chat=null;state.settingsSection=null;state.showStories=false;if(state.storyPlayer){stopStoryTimer();state.storyPlayer=null}state.storyViewersModal=null;state.ownerTransferPending=null;if(state.tab==='calls'){setCallsSeenAt(new Date().toISOString());state.missedCalls=[]}render();break;
case 'open-stories':state.showStories=true;state.tab='chats';render();break;
case 'close-stories':closeWithAnim('.overlay',()=>{state.showStories=false;render()});break;
case 'close-stories-bg':if(e.target.closest('.card'))return;closeWithAnim('.overlay',()=>{state.showStories=false;render()});break;

case 'scroll-to':{const m=document.querySelector(`[data-msg-id="${id}"]`);if(m){m.scrollIntoView({behavior:'smooth',block:'center'});m.style.outline='2px solid var(--accent)';setTimeout(()=>m.style.outline='',2000)}break}

case 'rm-story-media':if(state.storyMedia&&state.storyMediaType==='video'&&state.storyMedia.startsWith('blob:')){try{URL.revokeObjectURL(state.storyMedia)}catch(e){}}state.storyMedia=null;state.storyMediaFile=null;state.storyMediaType='image';render();break;
case 'publish-story':{const x=document.getElementById('story-text').value.trim();if(!x&&!state.storyMedia)return;let mu=null;if(state.storyMedia){try{if(state.storyMediaType==='video'&&state.storyMediaFile){const f=state.storyMediaFile;const ext=(f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'');const p=`stories/${state.user.id}/${uid()}.${ext||'mp4'}`;mu=await upMedia(p,f,f.type||'video/mp4')}else if(state.storyMediaType==='image'){const b=d2b(state.storyMedia);const p=`stories/${state.user.id}/${uid()}.jpg`;mu=await upMedia(p,b,'image/jpeg')}}catch(err){toast(err.message);return}}await sb.from('stories').insert({user_id:state.user.id,content:x,media_url:mu,background_color:state.storyBg});state.storyCompose=false;state.storyMedia=null;state.storyMediaFile=null;state.storyMediaType='image';await loadStories();state.showStories=true;state.tab='chats';render();break}

case 'theme-quick':{const next=cycleTheme();await sb.from('profiles').update({theme:next}).eq('id',state.user.id);await loadProf();S.theme=next;saveS();render();break}

document.addEventListener('change',async e=>{
if(e.target.id==='avatar-file'){const f=e.target.files[0];if(!f)return;try{const d=await rImg(f,300,0.85);const b=d2b(d);const p=`avatars/${state.user.id}.jpg`;const u=await upMedia(p,b,'image/jpeg');await sb.from('profiles').update({avatar_url:u+'?t='+Date.now()}).eq('id',state.user.id);await loadProf();render()}catch(err){toast(err.message)}e.target.value=''}
if(e.target.id==='group-avatar-file'){const f=e.target.files[0];if(!f||!state.groupSettings)return;try{const d=await rImg(f,300,0.85);const b=d2b(d);const p=`groups/${state.groupSettings}.jpg`;const u=await upMedia(p,b,'image/jpeg');await sb.from('chats').update({avatar_url:u+'?t='+Date.now()}).eq('id',state.groupSettings);await refresh();render()}catch(err){toast(err.message)}e.target.value=''}
if(e.target.id==='story-file'){const f=e.target.files[0];if(!f)return;try{if(f.type.startsWith('video/')){if(f.size>MAX){toast('Видео больше '+fSize(MAX));e.target.value='';return}state.storyMediaFile=f;state.storyMedia=URL.createObjectURL(f);state.storyMediaType='video';render()}else{state.storyMediaFile=null;state.storyMedia=await rImg(f,800,0.75);state.storyMediaType='image';render()}}catch(err){toast(err.message)}e.target.value=''}
if(e.target.id==='chat-file'){const f=e.target.files[0];if(!f)return;await sendFile(f);e.target.value=''}
if(e.target.dataset.act==='set-priv-ls'){await sb.from('profiles').update({privacy_last_seen:e.target.value}).eq('id',state.user.id);await loadProf();render()}
if(e.target.dataset.act==='set-priv-msg'){await sb.from('profiles').update({privacy_messages:e.target.value}).eq('id',state.user.id);await loadProf();render()}
if(e.target.dataset.act==='set-priv-groups'){await sb.from('profiles').update({privacy_groups:e.target.value}).eq('id',state.user.id);await loadProf();render()}
if(e.target.dataset.act==='set-ttl'){await sb.from('profiles').update({story_ttl_hours:parseInt(e.target.value)}).eq('id',state.user.id);await loadProf();render()}
});
document.addEventListener('input',e=>{
if(e.target.dataset.act==='search-input'){state.searchQuery=e.target.value;clearTimeout(window._st);window._st=setTimeout(()=>searchUsers(state.searchQuery).then(()=>{const l=document.getElementById('search-results');if(l)l.innerHTML=renderSearchResults()}),400)}
if(e.target.dataset.act==='pick-search-input'){state.searchQuery=e.target.value;const l=document.getElementById('pick-list');if(l)l.innerHTML=renderPickList()}
if(e.target.dataset.act==='contacts-search-input'){state.contactsSearchQuery=e.target.value;clearTimeout(window._cs);window._cs=setTimeout(()=>render(),200)}
if(e.target.dataset.act==='msg-search-input'){state.searchMsgsQuery=e.target.value;clearTimeout(window._ms);window._ms=setTimeout(()=>{const o=document.querySelector('.overlay');if(o)o.outerHTML=renderSearchMsgs();setTimeout(()=>{const inp=document.getElementById('msg-search-input');if(inp){inp.focus();const val=inp.value;inp.value='';inp.value=val}},0)},200)}
if(e.target.id==='msg-input'){setTyping();clearTimeout(typingTimer);typingTimer=setTimeout(()=>clearTyping(),3000)}
});
document.addEventListener('keydown',e=>{
if(e.key==='Enter'&&e.target.id==='msg-input'){e.preventDefault();sendMsg()}
if(e.key==='Enter'&&e.target.id==='ai-input'){e.preventDefault();sendAI()}
if(e.key==='Enter'&&e.target.id==='twofa-code'){e.preventDefault();document.querySelector('[data-act="verify-2fa"]')?.click()}
});
window.addEventListener('beforeunload',()=>{if(state.recording){try{state.mediaRecorder?.stop()}catch(e){}cleanRec()}stopStoryTimer();if(sigPollTimer)clearInterval(sigPollTimer);if(heartbeatTimer)clearInterval(heartbeatTimer);if(refreshInterval)clearInterval(refreshInterval);if(callPollTimer)clearInterval(callPollTimer)});
sb.auth.onAuthStateChange(async(ev,ss)=>{if(ev==='SIGNED_OUT'){const w=!!state.user;state.user=null;state.profile=null;if(w)render()}if(ev==='TOKEN_REFRESHED'&&ss?.user)state.user=ss.user;if(ev==='SIGNED_IN'&&ss?.user&&!state.user)state.user=ss.user});
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').then(reg=>console.log('SW OK',reg.scope)).catch(err=>console.warn('SW fail',err))}
(async()=>{try{await loadSess();if(state.user)await loadProf();if(state.user&&state.profile)await boot();else render()}catch(e){console.error('BOOT',e);fatal('Ошибка',String(e.message||e),'F12 → Console')}})();
})();
</script>
