<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Nova Messenger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root{--accent:#6366f1;--bg:#0e1015;--card:#171a22;--text:#e9ecf3;--muted:#8a92a6;--line:#242835;--fs:1;--online:#10b981}
body.light{--bg:#f4f5f9;--card:#fff;--text:#14161c;--muted:#6b7280;--line:#e6e8ef}
html,body{height:100%}
body{background:var(--bg);color:var(--text);overflow:hidden;font-size:calc(14px*var(--fs))}
#app{height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:12px}.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.btn{background:var(--card);border:1px solid var(--line);padding:12px 16px;border-radius:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.success{background:#10b981;border-color:#10b981;color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{background:#ef4444;border-color:#ef4444;color:#fff}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.icon{padding:8px;border-radius:10px;font-size:18px}
.auth-wrap{flex:1;display:grid;place-items:center;padding:20px;overflow-y:auto}
.auth-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px}
.logo{font-size:26px;font-weight:800;color:var(--accent)}
.err{color:#ef4444;font-size:13px;min-height:18px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.ava{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;background-size:cover;background-position:center;overflow:hidden;position:relative}
.ava.sm{width:34px;height:34px;font-size:17px;border-radius:12px}
.ava.big{width:64px;height:64px;font-size:30px;border-radius:20px}
.ava.xs{width:26px;height:26px;font-size:14px;border-radius:9px}
.ava.huge{width:110px;height:110px;font-size:54px;border-radius:36px}
.ava-online::after{content:'';position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;background:var(--online);border:2px solid var(--card);border-radius:50%}
.content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.content.chat{padding:0;gap:0}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card)}
.tab{flex:1;padding:8px 2px;font-size:10px;color:var(--muted);position:relative}
.tab.on{color:var(--accent);font-weight:600}
.tab-badge{position:absolute;top:2px;right:calc(50% - 22px);background:#ef4444;color:#fff;font-size:10px;padding:1px 5px;border-radius:8px;min-width:16px;text-align:center}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;position:relative}
.item.unread{background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.item-badge{background:#ef4444;color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:700;min-width:20px;text-align:center}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.banner{margin:10px;padding:12px;border:1px solid var(--accent);border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,var(--card));display:flex;flex-direction:column;gap:8px}
.pinned-bar{padding:8px 12px;background:color-mix(in srgb,var(--accent) 12%,var(--card));border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.reply-preview{padding:8px 12px;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:13px}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg-row{display:flex;gap:6px;align-items:flex-end;max-width:88%}
.msg-row.in{align-self:flex-start}
.msg-row.out{align-self:flex-end;flex-direction:row-reverse}
.msg-menu-btn{font-size:16px;color:var(--muted);opacity:0;padding:4px}
.msg-row:hover .msg-menu-btn{opacity:1}
.msg{display:flex;flex-direction:column;min-width:0;max-width:100%}
.msg.out{align-items:flex-end}.msg.in{align-items:flex-start}
.bubble{padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);word-break:break-word;max-width:100%}
.msg.out .bubble{background:var(--accent);border-color:var(--accent);color:#fff}
.bubble a{text-decoration:underline}
.bubble img.msg-image{max-width:260px;max-height:260px;border-radius:12px;display:block;margin-bottom:6px;object-fit:cover;cursor:pointer}
.bubble audio{max-width:260px;display:block;margin-bottom:4px}
.bubble video{max-width:280px;max-height:240px;border-radius:12px;display:block;margin-bottom:6px;background:#000}
.file-link{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:rgba(0,0,0,.25);text-decoration:none;color:inherit;margin-bottom:6px;max-width:280px}
.file-icon{font-size:22px;flex:none}
.file-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px}
.file-size{display:block;font-size:11px;opacity:.7}
.reply-quote{border-left:3px solid var(--accent);padding:4px 8px;margin-bottom:6px;background:rgba(0,0,0,.15);border-radius:6px;font-size:12px;cursor:pointer;max-width:100%}
.msg.out .reply-quote{background:rgba(255,255,255,.15)}
.reply-name{font-weight:600;color:var(--accent);margin-bottom:2px}
.msg.out .reply-name{color:#fff}
.reply-text{opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sender-name{font-size:11px;color:var(--accent);margin-bottom:2px;font-weight:600}
.edited-mark{opacity:.7;font-size:11px;margin-left:4px}
.ts{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:3px}
.ts .check{font-size:12px}
.ts .check.read{color:var(--accent)}
.msg.out .ts{color:rgba(255,255,255,.75)}
.msg.out .ts .check.read{color:#fff}
.reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.reaction-chip{padding:2px 8px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px;cursor:pointer}
.reaction-chip.mine{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 25%,transparent)}
.composer{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);align-items:center}
.composer .icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--bg);border:1px solid var(--line);flex:none}
.rec-bar{display:flex;align-items:center;gap:10px;flex:1;background:#ef4444;color:#fff;padding:10px 14px;border-radius:12px;font-weight:600}
.rec-bar .time{font-variant-numeric:tabular-nums}
.typing-indicator{display:none;padding:6px 16px;gap:4px;align-items:center;background:var(--card)}
.typing-indicator.on{display:flex}
.typing-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:tb 1.4s infinite ease-in-out;display:inline-block}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.stories-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.story{min-width:104px;height:150px;border-radius:18px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;font-weight:600;font-size:13px;cursor:pointer;background-size:cover;background-position:center;position:relative;overflow:hidden}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;z-index:50}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal{width:100%;max-width:460px;max-height:85vh;overflow:auto;position:relative}
.call{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;min-width:280px;max-width:520px}
.call-controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.call-btn{width:52px;height:52px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px;display:grid;place-items:center}
.call-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.call-btn.off{background:#ef4444;border-color:#ef4444;color:#fff}
.call-btn.danger{background:#ef4444;border-color:#ef4444;color:#fff}
#remote-video{width:100%;max-height:45vh;border-radius:16px;background:#111;object-fit:contain;min-height:180px}
#local-video{position:absolute;bottom:8px;right:8px;width:110px;height:80px;border-radius:10px;object-fit:cover;background:#000;border:1px solid var(--line);display:none}
.video-wrap{position:relative;width:100%}
.call-reaction{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);font-size:38px;animation:cf 2s ease-out forwards;pointer-events:none}
@keyframes cf{0%{opacity:0;transform:translate(-50%,20px)}30%{opacity:1;transform:translate(-50%,-10px)}100%{opacity:0;transform:translate(-50%,-60px)}}
.call-mini{position:fixed;top:70px;right:12px;width:38vw;max-width:200px;min-width:140px;background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:6px;z-index:45;box-shadow:0 6px 24px rgba(0,0,0,.55);cursor:pointer}
.call-mini .name{font-size:12px;font-weight:600;margin-bottom:4px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call-mini video{width:100%;height:90px;border-radius:10px;background:#000;object-fit:cover;display:block}
.call-mini .timer{font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
.call-mini-controls{display:flex;gap:4px;margin-top:6px;justify-content:center}
.call-mini-controls button{width:30px;height:30px;border-radius:50%;background:var(--bg);font-size:14px;display:grid;place-items:center;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 10px;border-radius:12px;border:1px solid var(--line);font-size:18px}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.dot.on{border-color:var(--text)}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.story-full{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:space-between;padding:20px;color:#fff;font-size:18px;font-weight:600}
.preview-media{width:100%;max-height:200px;object-fit:cover;border-radius:12px;display:block}
.badge{font-size:10px;padding:2px 6px;border-radius:6px;background:var(--line);color:var(--text)}
.badge.admin{background:#f59e0b;color:#000}
.badge.muted{background:#ef4444;color:#fff}
.member-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:var(--bg)}
.member-actions{display:flex;gap:6px;flex-wrap:wrap}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;overflow:hidden}
.lightbox img{max-width:88vw;max-height:88vh;width:auto;height:auto;object-fit:contain;border-radius:12px}
.boot{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;background:var(--bg)}
.boot .ring{width:52px;height:52px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
.boot .msg{font-size:15px;font-weight:600}
.boot .hint{font-size:12px;color:var(--muted);max-width:340px;line-height:1.5}
.boot .fatal-title{color:#ef4444;font-size:18px;font-weight:700;margin-bottom:8px}
.boot .fatal-text{font-size:14px;line-height:1.6;max-width:480px}
.boot .fatal-hint{font-size:13px;color:var(--muted);line-height:1.6;max-width:480px;margin-top:14px}
.boot code{background:var(--line);padding:2px 6px;border-radius:6px;font-size:12px}
.ai-chat{display:flex;flex-direction:column;height:60vh;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ai-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.ai-msg.user{align-self:flex-end;background:var(--accent);color:#fff}
.ai-msg.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.ai-msg img{max-width:100%;border-radius:10px;margin-bottom:6px;display:block}
.ai-composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:center}
.ai-composer .icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--bg);border:1px solid var(--line);flex:none}
.floating-ai{position:fixed;right:18px;bottom:78px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:24px;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:40}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:50vh;overflow-y:auto}
.call-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.call-item.missed{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3)}
.call-icon{font-size:18px;color:var(--accent)}
.call-icon.missed{color:#ef4444}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

function startCallPoll(){

    if(!state.call&&!state.incoming)return;
    try{
      if(state.incoming){
        const {data}=await sb.from('calls').select('status,created_at').eq('id',state.incoming.id).single();
        if(!data||data.status!=='ringing'){
          stopRingTimeout();stopRing();state.incoming=null;render();
        }else if(Date.now()-new Date(data.created_at).getTime()>RING_TIMEOUT){
          await sb.from('calls').update({status:'missed'}).eq('id',state.incoming.id);
          stopRingTimeout();stopRing();state.incoming=null;
          loadMissedCalls();loadAllCalls();render();

      }
      if(state.call&&!state.call.activeAt){
        const {data}=await sb.from('calls').select('status').eq('id',state.call.id).single();
        if(!data||(data.status!=='ringing'&&data.status!=='active')){
          cleanupCall();loadAllCalls();

function stopCallPoll(){if(callPollTimer){clearInterval(callPollTimer);callPollTimer=null}}

function subCalls(){

  if(callsListChannel){sb.removeChannel(callsListChannel);callsListChannel=null}
  callsChannel=sb.channel('calls_'+state.user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'calls',filter:`callee_id=eq.${state.user.id}`},async(p)=>{
    if(p.new.status==='ringing'){

      render();
    }
  }).on('postgres_changes',{event:'UPDATE',schema:'public',table:'calls'},async(p)=>{
    if(state.call&&p.new.id===state.call.id){
      if(p.new.status==='active'&&!state.call.activeAt){state.call.activeAt=new Date(p.new.accepted_at||Date.now()).getTime();stopAll();pConn();setupWebRTC();render()}
      else if(p.new.status==='ended'||p.new.status==='declined'||p.new.status==='missed')cleanupCall();
    }
    if(state.incoming&&p.new.id===state.incoming.id&&p.new.status!=='ringing'){
      state.incoming=null;stopRing();stopRingTimeout();
      if(p.new.status==='missed'){loadMissedCalls();loadAllCalls();toast(t('missedCall'),'#ef4444')}
      render();
    }
    if(p.new.status==='ended'||p.new.status==='missed'||p.new.status==='declined')loadAllCalls();
  }).subscribe();
  callsListChannel=sb.channel('calls_list_'+state.user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'calls',filter:`caller_id=eq.${state.user.id}`},()=>{loadAllCalls()}).subscribe();
}

async function ensureMic(){if(state.stream)return state.stream;try{state.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}catch(e){toast('Микрофон: '+e.message)}return state.stream}
function stopMic(){state.stream?.getTracks().forEach(t=>t.stop());state.stream=null}
function cleanMedia(){cameraTrack?.stop();cameraTrack=null;screenTrack?.stop();screenTrack=null;state.cameraOn=false;state.screenOn=false}
async function startCall(cid){

async function declineCall(){

function cleanupCall(){
  stopAll();stopCallPoll();
  if(ringTimeout){clearTimeout(ringTimeout);ringTimeout=null}
  if(callerTimeout){clearTimeout(callerTimeout);callerTimeout=null}
  clearInterval(callTimer);callTimer=null;
  if(sigPollTimer){clearInterval(sigPollTimer);sigPollTimer=null}
  stopMic();cleanMedia();
  if(dummyDrawTimer){clearInterval(dummyDrawTimer);dummyDrawTimer=null}
  if(dummyVideoTrack){try{dummyVideoTrack.stop()}catch(e){}dummyVideoTrack=null}
  dummyCanvas=null;
  if(pc){try{pc.close()}catch(e){}pc=null}
  state.call=null;state.muted=false;state.cameraOn=false;state.screenOn=false;state.callMinimized=false;remoteStream=null;
  processed=new Set();pendingSignals=[];
  if(sigChannel){sb.removeChannel(sigChannel);sigChannel=null}
  if(callReactChannel){sb.removeChannel(callReactChannel);callReactChannel=null}
  state.callReactions=[];

function createDummyVT(){
  try{
    if(!dummyCanvas){dummyCanvas=document.createElement('canvas');dummyCanvas.width=640;dummyCanvas.height=480;}
    const draw=()=>{
      const ctx=dummyCanvas.getContext('2d');
      ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,640,480);
      ctx.fillStyle='#666';ctx.font='bold 32px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('📷 Камера выключена',320,240);
    };
    draw();
    if(dummyDrawTimer){clearInterval(dummyDrawTimer)}
    dummyDrawTimer=setInterval(draw,500);
    const stream=dummyCanvas.captureStream(5);
    return stream.getVideoTracks()[0];
  }catch(e){console.warn('dummy',e);return null}
}
function setupWebRTC(){
  if(!state.call||pc||!state.stream)return;
  pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
  state.stream.getTracks().forEach(t=>pc.addTrack(t,state.stream));
  dummyVideoTrack=createDummyVT();
  if(dummyVideoTrack){
    const tr=pc.addTransceiver(dummyVideoTrack,{direction:'sendrecv'});
    videoSender=tr.sender;
    console.log('[CALL] video transceiver created, sender track:',tr.sender.track?.readyState);
  }else{
    const tr=pc.addTransceiver('video',{direction:'sendrecv'});
    videoSender=tr.sender;
    console.warn('[CALL] dummy VT failed, fallback transceiver');
  }
  pc.ontrack=e=>{
    console.log('[CALL] ontrack',e.track.kind,'streams:',e.streams.length,'readyState:',e.track.readyState);
    if(e.track.kind==='audio'){
      let a=document.getElementById('remote-audio');
      if(!a){a=document.createElement('audio');a.id='remote-audio';a.autoplay=true;a.playsInline=true;document.body.appendChild(a)}
      a.srcObject=e.streams[0]||new MediaStream([e.track]);
      a.play().catch(()=>{});
    }else if(e.track.kind==='video'){
      remoteStream=e.streams[0]||new MediaStream([e.track]);
      e.track.onunmute=()=>{console.log('[CALL] video unmuted, reattaching');attachRemote()};
      e.track.onmute=()=>console.log('[CALL] video muted');
      e.track.onended=()=>console.log('[CALL] video ended');
      attachRemote();
    }
  };
  pc.onicecandidate=e=>{if(e.candidate)sendSig('ice',{candidate:e.candidate.toJSON()})};
  pc.onconnectionstatechange=()=>{
    const el=document.getElementById('call-status'),dg=document.getElementById('call-diag');
    if(el)el.textContent=pc.connectionState==='connected'?t('connected'):pc.connectionState;
    if(dg)dg.textContent=`ICE:${pc.iceConnectionState}|Track:${videoSender?.track?.kind||'none'}`;
    if(pc.connectionState==='failed'){console.warn('[CALL] connection failed');}
  };
  subSigs(state.call.id);startSigPoll(state.call.id);
  if(callReactChannel){sb.removeChannel(callReactChannel);callReactChannel=null}
  callReactChannel=sb.channel('call_react_'+state.call.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'call_reactions',filter:`call_id=eq.${state.call.id}`},(p)=>{
    if(p.new.user_id===state.user.id)return;
    state.callReactions.push(p.new);render();
    setTimeout(()=>{state.callReactions=state.callReactions.filter(r=>r.id!==p.new.id);render()},2000);
  }).subscribe();
  if(state.call.outbound){
    pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>sendSig('offer',{sdp:pc.localDescription.toJSON()})).catch(e=>console.warn('offer',e));
  }
  if(pendingSignals.length){pendingSignals.forEach(s=>procSig(s));pendingSignals=[]}
  setInterval(async()=>{

async function procSig(s){
  if(!pc){pendingSignals.push(s);return}
  try{
    if(s.type==='offer'){
      await pc.setRemoteDescription(new RTCSessionDescription(s.payload.sdp));
      const a=await pc.createAnswer();await pc.setLocalDescription(a);
      await sendSig('answer',{sdp:pc.localDescription.toJSON()});
    }else if(s.type==='answer'){await pc.setRemoteDescription(new RTCSessionDescription(s.payload.sdp))}
    else if(s.type==='ice'){await pc.addIceCandidate(new RTCIceCandidate(s.payload.candidate)).catch(()=>{})}
  }catch(e){console.warn('sig',e)}
}

function renderApp(){const u=state.profile;const tabs=[['chats','💬',t('chats')],['calls','📞',t('calls')],['stories','✨',t('stories')],['contacts','👥',t('contacts')],['profile','⚙️',t('profile')]];const totalUnread=Object.values(state.unreadCounts).reduce((a,b)=>a+b,0);const missedCount=state.missedCalls.length;let ex='';if(state.showAI)ex+=renderAI();if(state.showBlocked)ex+=renderBlocked();if(state.aiModal==='image')ex+=renderImgModal();return `<header class="top">${aHtml(u)}<div class="grow"><b>${esc(u.display_name||u.username)}</b><div class="muted small">@${esc(u.username)}</div></div></header><main class="content ${state.chatId?'chat':''}">${state.chatId?renderChat():renderTab()}</main>${state.chatId?'':`<nav class="tabs">${tabs.map(([k,l,label])=>{let badge='';if(k==='chats'&&totalUnread>0)badge=`<span class="tab-badge">${totalUnread>99?'99+':totalUnread}</span>`;if(k==='calls'&&missedCount>0)badge=`<span class="tab-badge">${missedCount>99?'99+':missedCount}</span>`;return `<button class="tab ${state.tab===k?'on':''}" data-act="tab" data-tab="${k}">${l}<br>${label}${badge}</button>`}).join('')}</nav>`}${state.tab==='chats'&&!state.chatId?`<button class="floating-ai" data-act="open-ai">🤖</button>`:''}${state.modal==='pick'?renderPick():''}${state.modal==='search'?renderSearchModal():''}${state.createGroup?renderCreate():''}${state.viewMembers?renderMembers():''}${state.groupSettings?renderGroupSet():''}${state.storyCompose?renderStoryComp():''}${state.msgMenu?renderMsgMenu():''}${state.viewStory?renderStoryView():''}${state.viewProfile?renderProfileView():''}${state.incoming?renderIncoming():''}${state.call?renderCall():''}${state.lightbox?`<div class="lightbox" data-act="close-lb"><img src="${state.lightbox}"></div>`:''}${state.searchMsgs!==null?renderSearchMsgs():''}${state.showEmoji?renderEmojiPicker():''}${ex}`}
function renderTab(){if(state.tab==='calls')return renderCallsTab();if(state.tab==='stories')return renderStories();if(state.tab==='contacts')return renderContactsTab();if(state.tab==='profile')return renderProfile();return renderChats()}

function renderChats(){const seen=new Set();const list=state.chats.filter(c=>{if(!c||seen.has(c.id))return false;seen.add(c.id);return true});let h=`<div class="row between"><h2>${t('chats')}</h2><div class="row"><button class="btn small ghost" data-act="new-group">${t('newGroup')}</button><button class="btn small" data-act="new-chat">${t('newChat')}</button></div></div>`;if(!list.length)h+=`<div class="empty">${t('noChats')}</div>`;h+='<div class="list">';for(const c of list){const m=state.members[c.id]||[];const o=m.find(x=>x.user_id!==state.user.id);if(o&&isBlocked(o.user_id))continue;const op=o?state.profiles[o.user_id]:null;const ti=c.is_group?c.name:(op?.display_name||'Чат');const av=c.is_group?{avatar_url:c.avatar_url||null,accent_color:'#f59e0b',display_name:c.name}:(op||{});const ls=!c.is_group&&op?fLastSeen(op):'';const unread=state.unreadCounts[c.id]||0;h+=`<div class="item ${unread>0?'unread':''}" data-act="open-chat" data-id="${c.id}">${aHtml(av)}<div class="grow"><b>${esc(ti)}</b><div class="muted small">${c.is_group?`${m.length} ${t('members').toLowerCase()}`:(ls||'@'+esc(op?.username||'—'))}</div></div>${unread>0?`<span class="item-badge">${unread>99?'99+':unread}</span>`:''}</div>`}return h+'</div>'}
function renderCallsTab(){let h=`<div class="row between"><h2>${t('calls')}</h2></div>`;if(!state.allCalls.length){h+=`<div class="empty">${t('noCalls')}</div>`;return h}h+='<div class="list">';for(const c of state.allCalls){const out=c.caller_id===state.user.id;const otherId=out?c.callee_id:c.caller_id;const p=state.profiles[otherId];if(!p)continue;const missed=c.status==='missed';const icon=missed?'📵':(out?'📤':'📥');let status;if(c.status==='missed')status=t('missedCall');else if(c.status==='declined')status='Отклонён';else if(c.status==='ended')status=`${c.duration||0} сек`;else if(c.status==='active')status='Идёт';else status=c.status;h+=`<div class="call-item ${missed?'missed':''}" data-act="callback" data-id="${otherId}">${aHtml(p)}<div class="grow"><b>${esc(p.display_name||p.username)}</b><div class="muted small">${out?t('outgoing'):t('incoming')} · ${status} · ${tm(c.created_at)}</div></div><span class="call-icon ${missed?'missed':''}">${icon}</span></div>`}return h+'</div>'}
function renderContactsTab(){const mc=state.contacts.map(c=>state.profiles[c.contact_id]).filter(Boolean);const q=(state.contactsSearchQuery||'').toLowerCase().trim();const filtered=q?mc.filter(p=>(p.display_name||'').toLowerCase().includes(q)||(p.username||'').toLowerCase().includes(q)||(p.phone||'').includes(q)||(p.email||'').toLowerCase().includes(q)):mc;let h=`<div class="row between"><h2>${t('contacts')} (${mc.length})</h2><button class="btn small" data-act="search-friends">🔍</button></div>`;h+=`<input id="contacts-search" placeholder="${t('searchContacts')}" value="${esc(state.contactsSearchQuery)}" data-act="contacts-search-input" style="margin-bottom:8px">`;if(!filtered.length)h+=`<div class="empty">${q?t('noResults'):t('noContacts')}</div>`;h+='<div class="list">';for(const p of filtered){const ls=fLastSeen(p);h+=`<div class="item" data-act="open-contact-chat" data-id="${p.id}">${aHtml(p)}<div class="grow"><b>${esc(p.display_name||p.username)}</b><div class="muted small">${ls||('@'+esc(p.username))}</div></div><button class="icon" data-act="rm-contact" data-id="${p.id}">✕</button></div>`}return h+'</div>'}
function renderSearchModal(){return `<div class="overlay"><div class="card modal"><div class="row between"><b>${t('searchFriends')}</b><button class="icon" data-act="close-modal">✕</button></div><input id="search-input" placeholder="${t('searchEmpty')}" value="${esc(state.searchQuery||'')}" data-act="search-input" autofocus><div id="search-results">${renderSearchResults()}</div></div></div>`}
function renderSearchResults(){const r=state.searchResults;if(r===null||r===undefined)return `<div class="empty">${t('searchEmpty')}</div>`;if(!r.length)return `<div class="empty">${t('noResults')}</div>`;return '<div class="list">'+r.map(p=>`<div class="item" data-act="open-contact-chat" data-id="${p.id}">${aHtml(p)}<div class="grow"><b>${esc(p.display_name||p.username)}</b><div class="muted small">@${esc(p.username)}${p.phone?' · '+esc(p.phone):''}</div></div>${isContact(p.id)?'':`<button class="btn small success" data-act="add-contact" data-id="${p.id}">${t('add')}</button>`}</div>`).join('')+'</div>'}
function renderAI(){return `<div class="overlay"><div class="card modal" style="max-width:600px"><div class="row between"><b>🤖 AI</b><button class="icon" data-act="close-ai">✕</button></div><div class="ai-chat"><div class="ai-messages" id="ai-messages">${state.aiMessages.length===0?`<div class="empty">${esc(t('aiGreeting')).replace(/\n/g,'<br>')}</div>`:''}${state.aiMessages.map(m=>`<div class="ai-msg ${m.role}">${m.image?`<img src="${m.image}">`:''}${esc(m.content||'').replace(/\n/g,'<br>')}</div>`).join('')}${state.aiLoading?`<div class="ai-msg assistant"><span class="muted">${t('aiThinking')}</span></div>`:''}</div><div class="ai-composer"><button class="icon-btn" data-act="ai-image">🎨</button><button class="icon-btn" data-act="ai-clear">🧹</button><input id="ai-input" placeholder="${t('aiPlaceholder')}"><button class="btn primary" data-act="ai-send" style="padding:10px 16px">➤</button></div></div></div></div>`}
function renderImgModal(){return `<div class="overlay"><div class="card modal"><div class="row between"><b>🎨</b><button class="icon" data-act="close-ai-image">✕</button></div><input id="ai-image-prompt" placeholder="${t('describeImage')}"><button class="btn primary wide" data-act="ai-image-go">${t('generate')}</button><div id="ai-image-result"></div></div></div>`}
function renderBlocked(){const bl=state.blocks.map(b=>state.profiles[b.blocked_id]).filter(Boolean);return `<div class="overlay"><div class="card modal"><div class="row between"><b>${t('blocked')} (${bl.length})</b><button class="icon" data-act="close-blocked">✕</button></div>${bl.length?bl.map(p=>`<div class="member-row">${aHtml(p,'sm')}<div class="grow"><b>${esc(p.display_name||p.username)}</b></div><button class="btn small ghost" data-act="unblock" data-id="${p.id}">${t('unblock')}</button></div>`).join(''):`<div class="empty">${t('noUsers')}</div>`}</div></div>`}
function renderEmojiPicker(){return `<div class="overlay" data-act="close-emoji-bg"><div class="card modal" style="max-width:400px" onclick="event.stopPropagation()"><div class="row between"><b>Смайлики</b><button class="icon" data-act="close-emoji">✕</button></div><div class="emoji-grid">${ALL_EMOJI.map(em=>`<button class="chip" style="padding:4px;font-size:22px" data-act="insert-emoji" data-v="${em}">${em}</button>`).join('')}</div></div></div>`}
function renderSearchMsgs(){if(state.searchMsgs===null)return '';const q=(state.searchMsgsQuery||'').toLowerCase();const res=q?state.messages.filter(m=>m.content&&m.content.toLowerCase().includes(q)):state.messages;return `<div class="overlay"><div class="card modal"><div class="row between"><b>🔍 ${t('searchMsgs')}</b><button class="icon" data-act="close-msg-search">✕</button></div><input id="msg-search-input" placeholder="${t('search')}" value="${esc(state.searchMsgsQuery)}" data-act="msg-search-input" autofocus><div class="list" style="max-height:50vh;overflow:auto">${res.length?res.map(m=>`<div class="item" data-act="jump-to-msg" data-id="${m.id}"><div class="grow"><b>${esc(state.profiles[m.sender_id]?.display_name||'?')}</b><div class="muted small">${esc((m.content||'').slice(0,100))}</div><div class="small">${tm(m.created_at)}</div></div></div>`).join(''):`<div class="empty">${t('noResults')}</div>`}</div></div></div>`}
function renderMsgBody(m){let o='';if(m.reply_to_id){const parent=state.messages.find(x=>x.id===m.reply_to_id);if(parent){const psnd=state.profiles[parent.sender_id];o+=`<div class="reply-quote" data-act="scroll-to" data-id="${parent.id}"><div class="reply-name">${esc(psnd?.display_name||'?')}</div><div class="reply-text">${esc((parent.content||'📎').slice(0,80))}</div></div>`}}const u=m.media_url||'';const n=m.media_name||'file';const s=m.media_size?fSize(m.media_size):'';if(u&&m.media_type==='image')o+=`<img class="msg-image" src="${u}" data-act="open-lb" data-src="${u}">`;else if(u&&m.media_type==='audio')o+=`<audio controls preload="metadata" src="${u}"></audio>`;else if(u&&m.media_type==='video')o+=`<video controls preload="metadata" src="${u}"></video>`;else if(u&&m.media_type==='file')o+=`<a class="file-link" href="${u}" target="_blank" download="${esc(n)}"><span class="file-icon">📎</span><span class="file-info"><span class="file-name">${esc(n)}</span><span class="file-size">${s}</span></span></a>`;if(m.content)o+=`<div>${linkify(m.content)}${m.edited_at?'<span class="edited-mark">(изм.)</span>':''}</div>`;else if(m.edited_at)o+=`<span class="edited-mark">(изм.)</span>`;return o}
function renderChat(){
  const c=state.chat;if(!c)return '';
  const m=state.members[c.id]||[];
  const o=m.find(x=>x.user_id!==state.user.id);
  const op=o?state.profiles[o.user_id]:null;
  const ti=c.is_group?c.name:(op?.display_name||'Чат');
  const av=c.is_group?{avatar_url:c.avatar_url||null,accent_color:'#f59e0b',display_name:c.name}:(op||{});
  const mm=(m.find(x=>x.user_id===state.user.id)||{}).muted;
  const msgs=state.messages;const u=state.user;
  let bn='';
  if(!c.is_group&&o&&!isContact(o.user_id)&&!isBlocked(o.user_id)){const om=msgs.find(x=>x.sender_id===o.user_id);if(om)bn=`<div class="banner"><div><b>${t('addToContacts')}</b></div><div class="row"><button class="btn small success grow" data-act="bn-add" data-id="${o.user_id}">${t('add')}</button><button class="btn small danger grow" data-act="bn-block" data-id="${o.user_id}">${t('block')}</button></div></div>`}
  if(!c.is_group&&o&&isBlocked(o.user_id)){bn=`<div class="banner"><div class="muted">${t('youBlocked')} ${esc(op?.display_name||'?')}</div><button class="btn small ghost" data-act="unblock" data-id="${o.user_id}">${t('unblock')}</button></div>`}
  const pinned=msgs.filter(x=>x.pinned);let pinBar='';
  if(pinned.length){const p=pinned[pinned.length-1];const snd=state.profiles[p.sender_id];pinBar=`<div class="pinned-bar" data-act="scroll-to" data-id="${p.id}"><b>📌</b><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b>${esc(snd?.display_name||'?')}:</b> ${esc((p.content||'📎').slice(0,80))}</span></div>`}
  const replyPre=state.replyTo?`<div class="reply-preview"><b>↩️</b><span class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(state.messages.find(m=>m.id===state.replyTo)?.content||'')}</span><button class="icon" data-act="cancel-reply">✕</button></div>`:'';
  const comp=state.recording?`<div class="rec-bar"><span>●</span><span class="time" id="rec-time">00:00</span><div class="grow"></div><button class="btn small ghost" data-act="cancel-rec" style="color:#fff;border-color:rgba(255,255,255,.4)">Отмена</button><button class="btn small" data-act="stop-rec" style="background:#fff;color:#ef4444;border-color:#fff">Стоп</button></div>`:`<button class="icon-btn" data-act="emoji-toggle">😀</button><button class="icon-btn" data-act="attach-file">📎</button><input type="file" id="chat-file" accept="*/*" style="display:none"><input id="msg-input" placeholder="${mm?t('mutedByAdmin'):t('typeMessage')}" ${mm?'disabled':''}><button class="icon-btn" data-act="start-rec" ${mm?'disabled':''}>🎤</button><button class="btn primary" data-act="send" ${mm?'disabled':''}>➤</button>`;
  const ab=c.is_group?`<span data-act="open-gs" style="cursor:pointer">${aHtml(av,'sm')}</span>`:`<span data-act="view-prof" data-id="${o?.user_id||''}" style="cursor:pointer">${aHtml(av,'sm')}</span>`;
  const sb2=c.is_group?`${m.length} ${t('members').toLowerCase()}`:(op?fLastSeen(op)||('@'+esc(op.username)):'—');
  const eb=c.is_group&&isAdmin(c.id)?`<button class="icon" data-act="open-gs">⚙️</button>`:'';
  return `<div class="chat-head"><button class="icon" data-act="back">←</button>${ab}<div class="grow"><b>${esc(ti)}</b><div class="muted small">${sb2}</div></div><button class="icon" data-act="msg-search">🔍</button>${eb}${!c.is_group&&o?`<button class="icon" data-act="call" data-id="${o.user_id}">📞</button>`:''}</div>${pinBar}${bn}<div class="messages" id="msgs">${msgs.length?msgs.map(m=>{const out=m.sender_id===u.id;const snd=state.profiles[m.sender_id];const r=m.reactions||{};const rH=Object.entries(r).length?`<div class="reactions">${Object.entries(r).map(([e,a])=>`<button class="reaction-chip ${a.includes(u.id)?'mine':''}" data-act="react-msg" data-id="${m.id}" data-v="${e}">${e} ${a.length}</button>`).join('')}</div>`:'';return `<div class="msg-row ${out?'out':'in'}" data-msg-id="${m.id}"><div class="msg ${out?'out':'in'}">${c.is_group&&!out?`<div class="sender-name">${esc(snd?.display_name||'?')}</div>`:''}<div class="bubble">${renderMsgBody(m)}</div>${rH}${msgTs(m)}</div><button class="msg-menu-btn" data-act="msg-menu" data-id="${m.id}">⋯</button></div>`}).join(''):'<div class="empty">👋</div>'}</div><div id="typing-indicator" class="typing-indicator"></div>${mm?`<div class="muted small" style="text-align:center;padding:8px">${t('mutedByAdmin')}</div>`:''}${replyPre}<div class="composer">${comp}</div>`;
}
function renderStories(){let h=`<div class="row between"><h2>${t('stories')}</h2><button class="btn small" data-act="add-story">${t('addStory')}</button></div>`;if(!state.stories.length)h+=`<div class="empty">${t('noStories')}</div>`;h+='<div class="stories-row">';for(const s of state.stories){const au=state.profiles[s.user_id];if(!au)continue;const bg=s.media_url?`background-image:url(${s.media_url});background-size:cover;background-position:center`:`background:${s.background_color||'#6366f1'}`;h+=`<div class="story" data-act="view-story" data-id="${s.id}" style="${bg}">${aHtml(au,'xs','background:rgba(0,0,0,.35);')}<div><div>${esc(au.display_name)}</div><div class="small" style="opacity:.8">${tm(s.created_at)}</div></div></div>`}return h+'</div>'}
function renderProfile(){const u=state.profile;const ac=['#6366f1','#ec4899','#10b981','#f59e0b','#3b82f6','#ef4444','#8b5cf6','#14b8a6'];const lg=[['ru','Русский'],['en','English']];const notifState=('Notification' in window)?Notification.permission:'denied';return `<h2>${t('profile')}</h2><div class="card"><div class="row">${aHtml(u,'big')}<div class="grow"><input id="p-name" value="${esc(u.display_name||'')}" placeholder="${t('displayName')}"><input id="p-bio" value="${esc(u.bio||'')}" placeholder="${t('bio')}" style="margin-top:8px"><input id="p-phone" value="${esc(u.phone||'')}" placeholder="+7 ..." style="margin-top:8px"></div></div><button class="btn ghost" data-act="pick-av">${t('photoOnAvatar')}</button><input type="file" id="avatar-file" accept="image/*" style="display:none"><div class="lbl">${t('accent')}</div><div class="chips">${ac.map(c=>`<button class="dot ${u.accent_color===c?'on':''}" style="background:${c}" data-act="set-accent" data-v="${c}"></button>`).join('')}</div><button class="btn primary wide" data-act="save-prof">${t('saveProfile')}</button></div><div class="card"><div class="lbl">${t('notification')}</div>${notifState==='granted'?`<div class="small" style="color:var(--online)">✓ ${t('notifOn')}</div>`:notifState==='denied'?`<div class="small" style="color:#ef4444">${t('notifBlocked')} (F12 → Настройки → Уведомления)</div>`:`<button class="btn primary wide" data-act="allow-notif">${t('allowNotif')}</button>`}<div class="lbl">${t('appearance')}</div><button class="btn ghost" data-act="toggle-theme">${t('theme')}: ${u.theme==='light'?'☀️':'🌙'}</button><div class="row" style="gap:8px"><button class="btn ghost grow" data-act="fs-minus">A −</button><button class="btn ghost grow" data-act="fs-plus">A +</button></div><div class="lbl">${t('lang')}</div><div class="chips">${lg.map(([k,l])=>`<button class="btn small ${S.lang===k?'primary':'ghost'}" data-act="set-lang" data-v="${k}">${l}</button>`).join('')}</div><div class="lbl">${t('settings')}</div><button class="btn ghost" data-act="toggle-sounds">${S.sounds?t('soundsOn'):t('soundsOff')}</button><button class="btn ghost" data-act="toggle-notif">${S.notifications?t('notifOn'):t('notifOff')}</button><div class="lbl">${t('privacy')}</div><div class="small">${t('lastSeenPrivacy')}</div><select data-act="set-priv-ls" style="margin-bottom:8px">${['everyone','contacts','nobody'].map(v=>`<option value="${v}" ${(u.privacy_last_seen||'everyone')===v?'selected':''}>${t(v)}</option>`).join('')}</select><div class="small">${t('messagesPrivacy')}</div><select data-act="set-priv-msg" style="margin-bottom:8px">${['everyone','contacts','nobody'].map(v=>`<option value="${v}" ${(u.privacy_messages||'everyone')===v?'selected':''}>${t(v)}</option>`).join('')}</select><div class="small">${t('groupsPrivacy')}</div><select data-act="set-priv-groups">${['everyone','contacts','nobody'].map(v=>`<option value="${v}" ${(u.privacy_groups||'everyone')===v?'selected':''}>${t(v)}</option>`).join('')}</select><div class="lbl">${t('storyTtl')}</div><select data-act="set-ttl">${[1,6,12,24,48,72].map(h=>`<option value="${h}" ${(u.story_ttl_hours||24)===h?'selected':''}>${h} ${t('hours')}</option>`).join('')}</select><div class="lbl">${t('twofa')}</div><button class="btn ghost" data-act="${u.twofa_enabled?'disable-2fa':'enable-2fa'}">${u.twofa_enabled?t('twofaOn'):t('twofaOff')}</button><button class="btn ghost" data-act="show-blocked">${t('blocked')} (${state.blocks.length})</button><div style="height:10px"></div><button class="btn ghost" data-act="clear-cache">${t('cache')}</button><button class="btn danger wide" data-act="delete-account">🗑️ ${t('deleteAcc')}</button><button class="btn ghost" data-act="logout">${t('logout')}</button></div>`}

function renderStoryView(){const s=state.stories.find(x=>x.id===state.viewStory);if(!s)return '';const au=state.profiles[s.user_id];const r=s.reactions||{};const isMine=s.user_id===state.user.id;const media=s.media_url?`<img src="${s.media_url}" style="max-width:88vw;max-height:50vh;object-fit:contain;border-radius:16px">`:'';const bg=s.media_url?'background:#0b0c10':`background:${s.background_color||'#6366f1'}`;const rH=Object.entries(r).length?Object.entries(r).map(([e,a])=>`<span class="reaction-chip" style="color:#fff;background:rgba(255,255,255,.2);border:none">${e} ${a.length}</span>`).join(' '):'';return `<div class="story-full" style="${bg}" data-act="close-story"><div class="row">${aHtml(au,'xs','background:rgba(0,0,0,.35);')}<b>${esc(au?.display_name||'')}</b><div class="grow"></div><div class="small">${tm(s.created_at)}</div>${isMine?`<button class="icon" data-act="del-story" data-id="${s.id}" style="color:#fff">🗑️</button>`:''}</div><div style="display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;flex:1">${media}${s.content?`<div style="text-align:center">${esc(s.content)}</div>`:''}${rH?`<div style="text-align:center">${rH}</div>`:''}</div><div style="display:flex;flex-direction:column;gap:10px;align-items:center"><div class="chips" style="justify-content:center">${EMOJI.map(e=>{const c=(r[e]||[]).length;const mine=(r[e]||[]).includes(state.user.id);return `<button class="reaction-chip ${mine?'mine':''}" data-act="react-story" data-id="${s.id}" data-v="${e}" style="font-size:16px;padding:6px 10px;background:rgba(255,255,255,.2);border:none;color:#fff">${e}${c?' '+c:''}</button>`}).join('')}</div><button class="btn small" data-act="reply-story" data-id="${s.id}" style="background:rgba(255,255,255,.2);border:none;color:#fff">💬 ${t('reply')}</button><div class="small" style="opacity:.7">tap</div></div></div>`}
function renderMsgMenu(){const m=state.messages.find(x=>x.id===state.msgMenu);if(!m)return '';const mine=m.sender_id===state.user.id;return `<div class="overlay"><div class="card modal"><div class="row between"><b>${t('reaction')}</b><button class="icon" data-act="close-mm">✕</button></div><div class="chips" style="font-size:22px">${EMOJI.map(e=>`<button class="chip" data-act="react-msg" data-id="${m.id}" data-v="${e}">${e}</button>`).join('')}</div><button class="btn ghost" data-act="reply-msg" data-id="${m.id}">↩️ ${t('reply')}</button>${m.pinned?`<button class="btn ghost" data-act="unpin-msg" data-id="${m.id}">${t('unpinMsg')}</button>`:`<button class="btn ghost" data-act="pin-msg" data-id="${m.id}">${t('pinMsg')}</button>`}${mine&&m.content?`<button class="btn ghost" data-act="edit-msg" data-id="${m.id}">${t('edit')}</button>`:''}${mine?`<button class="btn danger" data-act="del-msg" data-id="${m.id}">${t('del')}</button>`:''}</div></div>`}

function renderIncoming(){const c=state.profiles[state.incoming.caller_id];return `<div class="overlay"><div class="call">${aHtml(c,'huge')}<h2>${esc(c?.display_name||'?')}</h2><div class="muted">${t('inCall')}</div><div class="row" style="width:100%;gap:10px"><button class="btn success grow" data-act="accept-call">${t('acceptCall')}</button><button class="btn danger grow" data-act="decline-call">${t('declineCall')}</button></div></div></div>`}

async function doAuth(){const lrEl=document.getElementById('a-login');const pwEl=document.getElementById('a-pass');const errEl=document.querySelector('.err');if(!lrEl||!pwEl)return;const lr=lrEl.value,pw=pwEl.value;const showErr=m=>{if(errEl)errEl.textContent=m;state.authErr=m};if(!pw){showErr('Введите пароль');return}const id=detId(lr);if(!id){showErr('Введите email или телефон');return}try{if(state.authMode==='register'){const unEl=document.getElementById('a-user');const nmEl=document.getElementById('a-name');const un=unEl?.value.trim();const nm=nmEl?.value.trim();if(!un){showErr('Введите логин');return}const {user,session}=await signUp(id.email,pw,un,nm||un);if(!session){showErr('Отключите Confirm email в Supabase');return}state.user=session.user||user;await loadProf();if(!state.profile){showErr('Профиль не создан');return}if(id.type==='phone'){await sb.from('profiles').update({phone:id.value}).eq('id',state.user.id);state.profile.phone=id.value}}else{const {data,error}=await sb.auth.signInWithPassword({email:id.email,password:pw});if(error)throw error;if(!data.session){showErr('Сессия не создана');return}state.user=data.session.user;await loadProf();if(!state.profile){showErr('Профиль не найден');return}}state.authErr='';await boot()}catch(e){showErr(e.message||String(e))}}
async function boot(){
  await loadProf();if(!state.profile){render();return}
  await loadChats();await loadStories();await loadAll();await loadContacts();await loadBlocks();
  await loadUnread();await loadMissedCalls();await loadAllCalls();
  subCalls();subProfiles();subGlobalMessages();startHeartbeat();
  await recoverActiveCalls();
  if('Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}
  if(refreshInterval)clearInterval(refreshInterval);
  refreshInterval=setInterval(async()=>{if(!document.hidden){await loadUnread();render()}},15000);
  render();
}
async function sendMsg(){const i=document.getElementById('msg-input');if(!i)return;const x=i.value.trim();if(!x||!state.chatId)return;const payload={chat_id:state.chatId,sender_id:state.user.id,content:x};if(state.replyTo)payload.reply_to_id=state.replyTo;const {error}=await sb.from('messages').insert(payload);if(error){toast(error.message);return}i.value='';state.replyTo=null;render();pSend();clearTyping()}

document.addEventListener('click',async e=>{
const el=e.target.closest('[data-act]');if(!el)return;
const a=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
switch(a){
case 'toggle-auth':state.authMode=state.authMode==='login'?'register':'login';state.authErr='';render();break;
case 'do-auth':doAuth();break;
case 'retry-prof':await loadProf();if(state.profile)await boot();else render();break;
case 'force-logout':{try{await sb.auth.signOut()}catch(e){}state.user=null;state.profile=null;state.authErr='';render();break}
case 'logout':signOut();break;
case 'delete-account':await deleteAccount();break;
case 'allow-notif':{if('Notification' in window){try{const p=await Notification.requestPermission();if(p==='granted'){toast('Включены','#10b981');notify('Nova','Уведомления работают','test',true)}else toast('Заблокированы','#ef4444')}catch(e){toast(e.message)}}render();break}
case 'callback':await startCall(id);break;
case 'tab':state.tab=el.dataset.tab;state.chatId=null;state.chat=null;render();break;
case 'open-chat':await openChat(id);break;
case 'back':state.chatId=null;state.chat=null;if(msgChannel){sb.removeChannel(msgChannel);msgChannel=null}if(typingChannel){sb.removeChannel(typingChannel);typingChannel=null}if(state.recording)stopRec(false);await loadUnread();render();break;
case 'send':sendMsg();break;
case 'new-chat':state.modal='pick';state.pickMode='chat';state.searchQuery='';render();break;
case 'new-group':state.createGroup=true;state.groupName='';state.groupMembers=[];render();break;
case 'pick-user':if(state.pickMode==='call')await startCall(id);else{const cid=await startDM(id);if(cid)await openChat(cid)}break;
case 'close-modal':state.modal=null;state.createGroup=false;state.viewMembers=false;state.storyCompose=false;state.storyMedia=null;state.searchResults=null;state.searchQuery='';render();break;
case 'toggle-member':if(state.groupMembers.includes(id))state.groupMembers=state.groupMembers.filter(x=>x!==id);else state.groupMembers.push(id);break;
case 'create-group-btn':{const n=document.getElementById('g-name').value.trim();if(!n||!state.groupMembers.length){toast('Выберите участников');return}el.disabled=true;const cid=await createGroup(n,state.groupMembers);el.disabled=false;if(cid){state.createGroup=false;await openChat(cid)}break}
case 'view-members':state.viewMembers=true;state.groupSettings=null;render();break;
case 'promote':await setRole(state.chatId||state.groupSettings,id,'admin');break;
case 'demote':await setRole(state.chatId||state.groupSettings,id,'member');break;
case 'mute':await setMuted(state.chatId||state.groupSettings,id,true);break;
case 'unmute':await setMuted(state.chatId||state.groupSettings,id,false);break;
case 'kick':await kickMember(state.chatId||state.groupSettings,id);break;
case 'leave-group':await leaveGroup(state.chatId||state.groupSettings);break;
case 'open-gs':state.groupSettings=state.chatId;render();break;
case 'close-gs':state.groupSettings=null;render();break;
case 'pick-gav':document.getElementById('group-avatar-file')?.click();break;
case 'save-gs':{const cid=state.groupSettings;if(!cid)return;const n=document.getElementById('gs-name').value.trim();const d=document.getElementById('gs-desc').value.trim();const {error}=await sb.from('chats').update({name:n,description:d}).eq('id',cid);if(error){toast(error.message);return}await refresh();state.groupSettings=null;render();break}
case 'delete-group':await deleteGroup(id);break;
case 'msg-menu':state.msgMenu=id;render();break;
case 'close-mm':state.msgMenu=null;render();break;
case 'react-msg':{const {data:ex}=await sb.from('reactions').select('*').eq('message_id',id).eq('user_id',state.user.id).eq('emoji',v).maybeSingle();if(ex)await sb.from('reactions').delete().eq('id',ex.id);else await sb.from('reactions').insert({message_id:id,user_id:state.user.id,emoji:v});state.msgMenu=null;break}
case 'reply-msg':{state.replyTo=id;state.msgMenu=null;render();setTimeout(()=>document.getElementById('msg-input')?.focus(),0);break}
case 'cancel-reply':{state.replyTo=null;render();break}
case 'edit-msg':{const m=state.messages.find(x=>x.id===id);if(!m||!m.content)return;const nt=prompt('',m.content);if(!nt||!nt.trim())return;await sb.from('messages').update({content:nt.trim(),edited_at:new Date().toISOString()}).eq('id',id);state.msgMenu=null;break}
case 'del-msg':if(confirm('Удалить?'))await sb.from('messages').delete().eq('id',id);state.msgMenu=null;break;
case 'pin-msg':await sb.from('messages').update({pinned:true,pinned_at:new Date().toISOString()}).eq('id',id);state.msgMenu=null;await loadMsgs(state.chatId);render();break;
case 'unpin-msg':await sb.from('messages').update({pinned:false,pinned_at:null}).eq('id',id);state.msgMenu=null;await loadMsgs(state.chatId);render();break;
case 'scroll-to':{const m=document.querySelector(`[data-msg-id="${id}"]`);if(m){m.scrollIntoView({behavior:'smooth',block:'center'});m.style.outline='2px solid var(--accent)';setTimeout(()=>m.style.outline='',2000)}break}
case 'msg-search':state.searchMsgs=[];state.searchMsgsQuery='';render();setTimeout(()=>document.getElementById('msg-search-input')?.focus(),100);break;
case 'close-msg-search':state.searchMsgs=null;render();break;
case 'jump-to-msg':{state.searchMsgs=null;render();setTimeout(()=>{const m=document.querySelector(`[data-msg-id="${id}"]`);if(m){m.scrollIntoView({behavior:'smooth',block:'center'});m.style.outline='2px solid var(--accent)';setTimeout(()=>m.style.outline='',2000)}},100);break}
case 'add-story':state.storyCompose=true;state.storyMedia=null;render();break;
case 'pick-story-media':document.getElementById('story-file')?.click();break;
case 'rm-story-media':state.storyMedia=null;render();break;
case 'publish-story':{const x=document.getElementById('story-text').value.trim();if(!x&&!state.storyMedia)return;let mu=null;if(state.storyMedia){try{const b=d2b(state.storyMedia);const p=`stories/${state.user.id}/${uid()}.jpg`;const {error:ue}=await sb.storage.from('media').upload(p,b,{contentType:'image/jpeg'});if(ue){toast(ue.message);return}const {data:ud}=sb.storage.from('media').getPublicUrl(p);mu=ud?.publicUrl}catch(err){toast(err.message);return}}await sb.from('stories').insert({user_id:state.user.id,content:x,media_url:mu,background_color:state.storyBg});state.storyCompose=false;state.storyMedia=null;await loadStories();state.tab='stories';render();break}
case 'view-story':state.viewStory=id;render();break;
case 'close-story':if(e.target.closest('img,button,audio,video'))return;state.viewStory=null;render();break;
case 'react-story':await reactStory(id,v);break;
case 'reply-story':await replyStory(id);break;
case 'del-story':await deleteStory(id);break;
case 'pick-av':document.getElementById('avatar-file')?.click();break;
case 'set-accent':await sb.from('profiles').update({accent_color:v}).eq('id',state.user.id);await loadProf();render();break;
case 'save-prof':{const n=document.getElementById('p-name').value.trim();const b=document.getElementById('p-bio').value.trim();const ph=document.getElementById('p-phone')?.value.trim()||'';const np=ph?nPhone(ph):null;if(ph&&!np){toast('Неверный номер');return}const upd={display_name:n,bio:b};if(np)upd.phone=np;const {error}=await sb.from('profiles').update(upd).eq('id',state.user.id);if(error){toast(error.message);return}await loadProf();render();break}
case 'toggle-theme':{const th=state.profile.theme==='light'?'dark':'light';await sb.from('profiles').update({theme:th}).eq('id',state.user.id);await loadProf();render();break}
case 'toggle-sounds':S.sounds=!S.sounds;saveS();render();break;
case 'toggle-notif':S.notifications=!S.notifications;saveS();render();break;
case 'fs-plus':S.fontScale=Math.min(1.4,(S.fontScale||1)+0.1);saveS();render();break;
case 'fs-minus':S.fontScale=Math.max(0.8,(S.fontScale||1)-0.1);saveS();render();break;
case 'set-lang':S.lang=v;saveS();render();break;
case 'clear-cache':if(!confirm('Очистить кэш?'))return;try{for(const k of Object.keys(localStorage)){if(k==='nova_ai'||k==='nova_settings'||k==='nova-auth')continue;localStorage.removeItem(k)}}catch(e){}break;
case 'call':await startCall(id);break;
case 'accept-call':await acceptCall();break;
case 'decline-call':await declineCall();break;
case 'end-call':await endCall();break;
case 'minimize-call':if(e.target!==el)return;state.callMinimized=true;render();break;
case 'minimize-btn':state.callMinimized=true;render();break;
case 'expand-call':if(e.target.closest('button'))return;state.callMinimized=false;render();break;
case 't-mute':tMute();break;
case 't-cam':await tCam();break;
case 't-scr':await tScreen();break;
case 'call-react-menu':{const em=prompt('Реакция (😀 ❤️ 👍 😂 🔥)','❤️');if(em&&state.call){try{await sb.from('call_reactions').insert({call_id:state.call.id,user_id:state.user.id,emoji:em})}catch(err){}}break}
case 'start-rec':await startRec();break;
case 'stop-rec':stopRec(true);break;
case 'cancel-rec':stopRec(false);break;
case 'attach-file':document.getElementById('chat-file')?.click();break;
case 'open-lb':e.stopPropagation();state.lightbox=el.dataset.src;render();break;
case 'close-lb':state.lightbox=null;render();break;
case 'emoji-toggle':state.showEmoji=true;render();break;
case 'close-emoji':state.showEmoji=false;render();break;
case 'close-emoji-bg':if(e.target.classList.contains('overlay')){state.showEmoji=false;render()}break;
case 'insert-emoji':{const inp=document.getElementById('msg-input');if(inp){inp.value+=v;inp.focus()}state.showEmoji=false;render();break}
case 'open-ai':state.showAI=true;render();setTimeout(()=>{const m=document.getElementById('ai-messages');if(m)m.scrollTop=m.scrollHeight},50);break;
case 'close-ai':state.showAI=false;render();break;
case 'ai-send':await sendAI();break;
case 'ai-clear':if(confirm('Очистить?')){state.aiMessages=[];saveAI();render()}break;
case 'ai-image':state.aiModal='image';render();break;
case 'close-ai-image':state.aiModal=null;render();break;
case 'ai-image-go':await genImg();break;
case 'ai-dl':{const u=el.dataset.src;const a=document.createElement('a');a.href=u;a.download='nova-ai.png';a.target='_blank';a.click();break}
case 'ai-to':{state.aiMessages.push({role:'assistant',content:'',image:el.dataset.src});saveAI();state.aiModal=null;render();break}
case 'open-ai-lb':state.lightbox=el.dataset.src;state.aiModal=null;render();break;
case 'view-prof':state.viewProfile=id;render();break;
case 'close-pv':state.viewProfile=null;render();break;
case 'pv-chat':state.viewProfile=null;await openChat(id);break;
case 'dm-pv':{const cid=await startDM(id);state.viewProfile=null;if(cid)await openChat(cid);break}
case 'add-contact':await addContact(id);break;
case 'add-contact-pv':await addContact(id);break;
case 'rm-contact':await removeContact(id);break;
case 'rm-contact-pv':await removeContact(id);break;
case 'bn-add':await addContact(id);break;
case 'bn-block':await blockUser(id);break;
case 'block':await blockUser(id);break;
case 'block-pv':await blockUser(id);break;
case 'unblock':await unblockUser(id);break;
case 'unblock-pv':await unblockUser(id);break;
case 'show-blocked':state.showBlocked=true;render();break;
case 'close-blocked':state.showBlocked=false;render();break;
case 'search-friends':state.modal='search';state.searchQuery='';state.searchResults=null;render();setTimeout(()=>{document.getElementById('search-input')?.focus()},100);break;
case 'open-contact-chat':{const cid=await startDM(id);state.modal=null;state.searchResults=null;state.searchQuery='';if(cid)await openChat(cid);break}
case 'enable-2fa':await sb.from('profiles').update({twofa_enabled:true}).eq('id',state.user.id);await loadProf();toast('2FA включена','#10b981');render();break;
case 'disable-2fa':await sb.from('profiles').update({twofa_enabled:false}).eq('id',state.user.id);await loadProf();toast('2FA выключена','#10b981');render();break;
case 'verify-2fa':{const code=document.getElementById('twofa-code').value.trim();if(!code){toast('Введите код');return}try{const {error}=await sb.auth.verifyOtp({email:state.pending2FA.email,token:code,type:'email'});if(error)throw error;state.pending2FA=null;await loadSess();await boot()}catch(err){toast(err.message)}break}
case 'cancel-2fa':state.pending2FA=null;render();break;
}
});

document.addEventListener('change',async e=>{
if(e.target.id==='avatar-file'){const f=e.target.files[0];if(!f)return;try{const d=await rImg(f,300,0.85);const b=d2b(d);const p=`avatars/${state.user.id}.jpg`;const {error:ue}=await sb.storage.from('media').upload(p,b,{upsert:true,contentType:'image/jpeg'});if(ue){toast(ue.message);return}const {data:ud}=sb.storage.from('media').getPublicUrl(p);await sb.from('profiles').update({avatar_url:ud.publicUrl+'?t='+Date.now()}).eq('id',state.user.id);await loadProf();render()}catch(err){toast(err.message)}e.target.value=''}
if(e.target.id==='group-avatar-file'){const f=e.target.files[0];if(!f||!state.groupSettings)return;try{const d=await rImg(f,300,0.85);const b=d2b(d);const p=`groups/${state.groupSettings}.jpg`;const {error:ue}=await sb.storage.from('media').upload(p,b,{upsert:true,contentType:'image/jpeg'});if(ue){toast(ue.message);return}const {data:ud}=sb.storage.from('media').getPublicUrl(p);await sb.from('chats').update({avatar_url:ud.publicUrl+'?t='+Date.now()}).eq('id',state.groupSettings);await refresh();render()}catch(err){toast(err.message)}e.target.value=''}
if(e.target.id==='story-file'){const f=e.target.files[0];if(!f)return;try{state.storyMedia=await rImg(f,800,0.75);render()}catch(err){toast(err.message)}e.target.value=''}
if(e.target.id==='chat-file'){const f=e.target.files[0];if(!f)return;await sendFile(f);e.target.value=''}
if(e.target.dataset.act==='set-priv-ls'){await sb.from('profiles').update({privacy_last_seen:e.target.value}).eq('id',state.user.id);await loadProf();render()}
if(e.target.dataset.act==='set-priv-msg'){await sb.from('profiles').update({privacy_messages:e.target.value}).eq('id',state.user.id);await loadProf();render()}
if(e.target.dataset.act==='set-priv-groups'){await sb.from('profiles').update({privacy_groups:e.target.value}).eq('id',state.user.id);await loadProf();render()}
if(e.target.dataset.act==='set-ttl'){await sb.from('profiles').update({story_ttl_hours:parseInt(e.target.value)}).eq('id',state.user.id);await loadProf();render()}
});

document.addEventListener('input',e=>{
if(e.target.dataset.act==='search-input'){state.searchQuery=e.target.value;clearTimeout(window._st);window._st=setTimeout(()=>searchUsers(state.searchQuery).then(()=>{const l=document.getElementById('search-results');if(l)l.innerHTML=renderSearchResults()}),400)}
if(e.target.dataset.act==='pick-search-input'){state.searchQuery=e.target.value;const l=document.getElementById('pick-list');if(l)l.innerHTML=renderPickList()}
if(e.target.dataset.act==='contacts-search-input'){state.contactsSearchQuery=e.target.value;clearTimeout(window._cs);window._cs=setTimeout(()=>render(),200)}
if(e.target.dataset.act==='msg-search-input'){state.searchMsgsQuery=e.target.value;clearTimeout(window._ms);window._ms=setTimeout(()=>{const o=document.querySelector('.overlay');if(o)o.outerHTML=renderSearchMsgs();setTimeout(()=>{const inp=document.getElementById('msg-search-input');if(inp){inp.focus();const val=inp.value;inp.value='';inp.value=val}},0)},200)}
if(e.target.id==='msg-input'){setTyping();clearTimeout(typingTimer);typingTimer=setTimeout(()=>clearTyping(),3000)}
});

document.addEventListener('keydown',e=>{
if(e.key==='Enter'&&e.target.id==='msg-input'){e.preventDefault();sendMsg()}
if(e.key==='Enter'&&e.target.id==='ai-input'){e.preventDefault();sendAI()}
if(e.key==='Enter'&&e.target.id==='twofa-code'){e.preventDefault();document.querySelector('[data-act="verify-2fa"]')?.click()}
});

window.addEventListener('beforeunload',()=>{if(state.recording){try{state.mediaRecorder?.stop()}catch(e){}cleanRec()}if(sigPollTimer)clearInterval(sigPollTimer);if(heartbeatTimer)clearInterval(heartbeatTimer);if(refreshInterval)clearInterval(refreshInterval);if(callPollTimer)clearInterval(callPollTimer)});
sb.auth.onAuthStateChange(async(ev,ss)=>{if(ev==='SIGNED_OUT'){const w=!!state.user;state.user=null;state.profile=null;if(w)render()}if(ev==='TOKEN_REFRESHED'&&ss?.user)state.user=ss.user;if(ev==='SIGNED_IN'&&ss?.user&&!state.user)state.user=ss.user});

(async()=>{try{await loadSess();if(state.user)await loadProf();if(state.user&&state.profile)await boot();else render()}catch(e){console.error('BOOT',e);fatal('Ошибка',String(e.message||e),'F12 → Console')}})();
})();
</script>
</body>
</html>
